<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢分析系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f;
            --border-color: #e0e0e0; --bg-light: #f8f9fa;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-light); margin: 0; padding-bottom: 70px; color: #2c3e50; }
        
        /* 導覽列 */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #fff; display: flex; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #7f8c8d; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }

        /* 頁面切換 */
        .page { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 元件樣式 */
        .box { background: #fff; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 15px; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px 0; font-weight: 600; }
        input, select { 
            width: 100% !important; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fff;
        }
        .grid-2 { display: flex; gap: 10px; margin-top: 10px; }
        .grid-2 > div { flex: 1; }
        .dash-val { font-size: 22px; font-weight: 800; }
        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
        .btn-main { background: var(--primary); color: #fff; width: 100%; }
        .btn-sub { background: #f1f2f6; border: 1px solid #ccc; width: 100%; }
        
        /* 圖表與清單 */
        .chart-container { position: relative; height: 250px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { background: #718093; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .roi-up { color: var(--danger); } .roi-down { color: var(--success); }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <h2 style="text-align:center;">🏠 我的投資首頁</h2>
        <div class="box" style="border-left: 5px solid var(--primary);">
            <select id="user-select" onchange="onUserChange()"></select>
        </div>
        <div class="box">
            <div class="grid-2">
                <div><label>總市值</label><div id="stat-value" class="dash-val" style="color:var(--primary)">$0</div></div>
                <div><label>目前投入</label><div id="stat-net" class="dash-val">$0</div></div>
            </div>
            <div id="stat-roi" style="margin-top:10px; font-weight:bold; border-top:1px dashed #ddd; padding-top:10px;">$0 (0%)</div>
        </div>
        <div class="box">
            <span class="box-title">📊 資產趨勢</span>
            <div class="chart-container"><canvas id="assetChart"></canvas></div>
        </div>
        <div class="box">
            <span class="box-title">➕ 快速新增交易</span>
            <label>標的</label><input type="text" id="f-target" placeholder="例如: 00675L" style="text-transform: uppercase;">
            <label>日期</label><input type="date" id="f-date">
            <div class="grid-2">
                <div><label>股數</label><input type="number" id="f-shares" inputmode="decimal"></div>
                <div><label>金額</label><input type="number" id="f-amount" inputmode="decimal"></div>
            </div>
            <button class="btn-main" style="margin-top:15px;" onclick="quickSave()">儲存交易</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <h2 style="text-align:center;">📜 歷史管理</h2>
        <div class="box" style="background:#fffdf9; border-left:5px solid var(--warning);">
            <span class="box-title">🕒 歷史點位補錄</span>
            <label>選擇補錄日期</label>
            <input type="date" id="sync-history-date">
            <div id="sync-price-list" style="margin-top:10px;"></div>
            <button class="btn-main" style="background:var(--warning); margin-top:10px;" onclick="saveHistoryPoint()">儲存該日快照</button>
        </div>
        <div class="box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="box-title">📋 交易明細</span>
                <select id="filter-target" onchange="renderHistoryList()" style="width:auto; height:30px; font-size:12px;"></select>
            </div>
            <div id="records-list"></div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <h2 style="text-align:center;">⚙️ 系統設定</h2>
        <div class="box">
            <span class="box-title">👤 帳戶管理</span>
            <div style="display:flex; gap:5px; flex-wrap:wrap;">
                <button onclick="addUser()" class="btn-sub" style="flex:1;">新增帳戶</button>
                <button onclick="renameUser()" class="btn-sub" style="flex:1;">修改名稱</button>
                <button onclick="deleteUser()" class="btn-sub" style="flex:1; color:var(--danger);">刪除帳戶</button>
            </div>
        </div>
        <div class="box">
            <span class="box-title">💾 資料備份</span>
            <div class="grid-2">
                <button onclick="exportData()" class="btn-sub">📤 匯出 JSON</button>
                <button onclick="document.getElementById('importFile').click()" class="btn-sub">📥 匯入 JSON</button>
            </div>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)"><i>🏠</i>首頁</div>
        <div class="nav-item" onclick="switchPage('history', this)"><i>📜</i>歷史</div>
        <div class="nav-item" onclick="switchPage('settings', this)"><i>⚙️</i>設定</div>
    </div>

    <script>
        var records = JSON.parse(localStorage.getItem('v11_recs')) || [];
        var marketPrices = JSON.parse(localStorage.getItem('v11_prices')) || {};
        var assetHistory = JSON.parse(localStorage.getItem('v11_hist')) || {};
        var users = JSON.parse(localStorage.getItem('v11_users')) || ['預設帳戶'];
        var chartInstance = null;

        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('f-date').value = today;
            document.getElementById('sync-history-date').value = today;
            updateUserDropdown();
            render();
        }

        function switchPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(pageId === 'home') render();
            if(pageId === 'history') { renderHistoryList(); renderSyncPrices(); }
        }

        // --- 核心邏輯 ---
        function saveAll() {
            localStorage.setItem('v11_recs', JSON.stringify(records));
            localStorage.setItem('v11_prices', JSON.stringify(marketPrices));
            localStorage.setItem('v11_hist', JSON.stringify(assetHistory));
            localStorage.setItem('v11_users', JSON.stringify(users));
        }

        function quickSave() {
            var user = document.getElementById('user-select').value;
            var target = document.getElementById('f-target').value.toUpperCase();
            var date = document.getElementById('f-date').value;
            var shares = parseFloat(document.getElementById('f-shares').value) || 0;
            var amount = parseFloat(document.getElementById('f-amount').value) || 0;
            if(!target || !date || shares <= 0) return alert('請填寫完整');
            records.push({ user, target, date, shares, amount });
            saveAll(); render(); alert('儲存成功！');
        }

        function saveHistoryPoint() {
            var user = document.getElementById('user-select').value;
            var targetDate = document.getElementById('sync-history-date').value;
            var inputs = document.getElementsByClassName('sync-price-input');
            var limit = new Date(targetDate);
            var filtered = records.filter(r => r.user === user && new Date(r.date) <= limit);
            
            var port = {}; var dayCost = 0; var dayValue = 0;
            filtered.forEach(r => {
                if(!port[r.target]) port[r.target] = { s: 0, c: 0 };
                port[r.target].s += r.shares; port[r.target].c += r.amount;
            });
            for(var i=0; i<inputs.length; i++){
                var code = inputs[i].dataset.code;
                var price = parseFloat(inputs[i].value) || 0;
                if(port[code]) {
                    dayValue += (port[code].s * price);
                    dayCost += port[code].c;
                }
            }
            if(!assetHistory[user]) assetHistory[user] = [];
            var existIdx = assetHistory[user].findIndex(h => h.date === targetDate);
            var snap = { date: targetDate, value: Math.round(dayValue), cost: Math.round(dayCost) };
            if(existIdx > -1) assetHistory[user][existIdx] = snap; else assetHistory[user].push(snap);
            assetHistory[user].sort((a,b) => new Date(a.date) - new Date(b.date));
            saveAll(); alert('快照已儲存');
        }

        // --- 渲染 ---
        function render() {
            var user = document.getElementById('user-select').value;
            var prs = marketPrices[user] || {};
            var port = {}; var tCost = 0; var tValue = 0;
            records.filter(r => r.user === user).forEach(r => {
                if(!port[r.target]) port[r.target] = { s: 0, c: 0 };
                port[r.target].s += r.shares; port[r.target].c += r.amount;
            });
            for(var c in port) {
                tCost += port[c].c; tValue += port[c].s * (prs[c] || 0);
            }
            document.getElementById('stat-net').innerText = '$' + Math.round(tCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(tValue).toLocaleString();
            var roi = tValue - tCost;
            var per = tCost > 0 ? (roi/tCost*100).toFixed(2) : '0';
            document.getElementById('stat-roi').innerText = `${roi>=0?'+':''}${Math.round(roi).toLocaleString()} (${per}%)`;
            document.getElementById('stat-roi').className = roi >= 0 ? 'roi-up' : 'roi-down';
            drawChart(user);
        }

        function renderHistoryList() {
            var user = document.getElementById('user-select').value;
            var list = document.getElementById('records-list'); list.innerHTML = '';
            records.filter(r => r.user === user).sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((r, i) => {
                list.innerHTML += `<div class="item">
                    <div><span class="tag">${r.target}</span> <small>${r.date}</small></div>
                    <div><b>$${r.amount.toLocaleString()}</b> <button class="action-btn" onclick="deleteRec(${i})" style="color:red;border:none;background:none;">[刪除]</button></div>
                </div>`;
            });
        }

        function renderSyncPrices() {
            var user = document.getElementById('user-select').value;
            var container = document.getElementById('sync-price-list'); container.innerHTML = '';
            var targets = [...new Set(records.filter(r => r.user === user).map(r => r.target))];
            targets.forEach(t => {
                container.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <span>${t}</span><input type="number" class="sync-price-input" data-code="${t}" style="width:120px;height:35px;">
                </div>`;
            });
        }

        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var data = assetHistory[user] || [];
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: '市值', data: data.map(h => ({x:h.date, y:h.value})), borderColor: '#3a5fcd', fill: true, backgroundColor: 'rgba(58,95,205,0.1)' },
                        { label: '成本', data: data.map(h => ({x:h.date, y:h.cost})), borderColor: '#999', borderDash: [5,5] }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { type: 'time', time: { unit: 'month' } } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function addUser() { var n = prompt('帳戶名稱？'); if(n){ users.push(n); saveAll(); updateUserDropdown(); }}
        function updateUserDropdown() { document.getElementById('user-select').innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join(''); }
        function onUserChange() { render(); }
        function exportData() {
            const blob = new Blob([JSON.stringify({recs:records, prices:marketPrices, hist:assetHistory, users:users})], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `備份_${new Date().getTime()}.json`; a.click();
        }
        init();
    </script>
</body>
</html>
