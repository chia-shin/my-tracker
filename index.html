<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢管理 - 備份功能版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f;
            --border-color: #e0e0e0; --text-sub: #7f8c8d;
        }

        body { font-family: -apple-system, sans-serif; background-color: #f8f9fa; padding: 15px; margin: 0; color: #2c3e50; }
        h1 { font-size: 20px; text-align: center; color: var(--primary); margin: 10px 0; }
        
        .box { background: #fff; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; width: 100%; overflow: hidden; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: block; }
        
        label { display: block; font-size: 13px; color: var(--text-sub); margin: 8px 0 4px 0; font-weight: 600; }
        
        input, select { 
            width: 100% !important; display: block; padding: 12px; border: 1px solid #ccc; 
            border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; margin-bottom: 5px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .dash-val { font-size: 22px; font-weight: 800; }
        .roi-up { color: var(--danger); }
        .roi-down { color: var(--success); }

        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
        .btn-main { background: var(--primary); color: #fff; width: 100%; margin-top: 10px; }
        .btn-backup { background: #f1f2f6; color: #2c3e50; font-size: 12px; margin-top: 5px; border: 1px solid #ccc; }
        
        .chart-container { position: relative; height: 200px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { background: #718093; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        
        .user-actions { display: flex; gap: 5px; margin-top: 8px; }
        .user-actions button { flex: 1; border: 1px solid #ddd; background: #f9f9f9; color: #333; }
        .action-btn { background: none; border: 1px solid #ccc; padding: 4px 8px; font-size: 12px; color: #666; width: auto; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>📈 投資走勢管理系統</h1>

    <div class="box" style="border-left: 5px solid var(--success);">
        <span class="box-title" style="color: var(--success);">👤 帳戶管理</span>
        <select id="filter-user" onchange="onUserChange()"></select>
        <div class="user-actions">
            <button onclick="addUser()">➕ 新增</button>
            <button onclick="renameUser()">✎ 更名</button>
            <button onclick="deleteUser()" style="color: var(--danger);">🗑️ 刪除</button>
        </div>
    </div>

    <div class="box">
        <div class="grid-2">
            <div>
                <label>總市值</label>
                <div id="stat-value" class="dash-val" style="color: var(--primary);">$0</div>
            </div>
            <div>
                <label>投入成本</label>
                <div id="stat-net" class="dash-val">$0</div>
            </div>
        </div>
        <div id="stat-roi" style="margin-top: 10px; font-weight: bold; border-top: 1px dashed #ddd; padding-top: 8px;">$0 (0.00%)</div>
    </div>

    <div class="box">
        <span class="box-title">📊 資產趨勢圖</span>
        <div class="chart-container">
            <canvas id="assetChart"></canvas>
        </div>
    </div>

    <div class="box" style="background: #fffdf9; border-left: 5px solid var(--warning);">
        <span class="box-title" style="color: var(--warning);">⚡ 更新今日現價</span>
        <div id="quick-sync-list"></div>
        <button class="btn-main" style="background: var(--warning);" onclick="updateAllMarketValues()">💾 儲存現價並更新走勢</button>
    </div>

    <div class="box">
        <span class="box-title" id="form-title">✨ 新增投資紀錄</span>
        <input type="hidden" id="form-edit-index" value="-1">
        <label>投資標的</label>
        <input type="text" id="form-target" placeholder="例如: QLD" style="text-transform: uppercase;">
        <label>交易日期</label>
        <input type="date" id="form-date">
        <label>交易類型</label>
        <select id="form-type" onchange="toggleFields()">
            <option value="deposit">買入 (支付款項)</option>
            <option value="withdraw">賣出 (拿回款項)</option>
        </select>
        <div class="grid-2">
            <div><label id="lbl-shares">買入股數</label><input type="number" id="form-shares" inputmode="decimal"></div>
            <div><label id="lbl-amt">實際總金額</label><input type="number" id="form-amount" inputmode="decimal"></div>
        </div>
        <button class="btn-main" onclick="saveRecord()" id="btn-submit">確認儲存紀錄</button>
        <button id="btn-cancel" onclick="cancelEdit()" style="display:none; width:100%; margin-top:5px; padding:10px; background:#718093; color:white; border:none; border-radius:8px;">取消修改</button>
    </div>

    <div class="box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="box-title">📋 交易明細</span>
            <select id="filter-target" onchange="render()" style="width:auto; font-size:12px; padding:4px; margin:0;"></select>
        </div>
        <div id="records-list"></div>
    </div>

    <div class="box" style="background: #f8f9fa;">
        <span class="box-title">💾 資料備份與恢復</span>
        <p style="font-size:11px; color:#666; margin-top:-8px;">更換裝置或清除瀏覽器前，請先匯出備份。</p>
        <div class="grid-2">
            <button class="btn-backup" onclick="exportData()">📤 匯出資料檔案</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 匯入備份檔案</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>

    <script>
        // 版本 V8 核心邏輯
        var records = JSON.parse(localStorage.getItem('invest_v8_recs')) || [];
        var marketPrices = JSON.parse(localStorage.getItem('invest_v8_prices')) || {};
        var assetHistory = JSON.parse(localStorage.getItem('invest_v8_hist')) || {};
        var users = JSON.parse(localStorage.getItem('invest_v8_users')) || ['預設帳戶'];
        var chartInstance = null;

        function init() {
            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            updateUserDropdown();
            onUserChange();
        }

        // --- 備份核心功能 ---
        function exportData() {
            const data = {
                recs: records,
                prices: marketPrices,
                hist: assetHistory,
                users: users,
                exportDate: new Date().toLocaleString()
            };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `投資備份_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (confirm('匯入將覆蓋目前所有資料，確定嗎？')) {
                        records = data.recs || [];
                        marketPrices = data.prices || {};
                        assetHistory = data.hist || {};
                        users = data.users || ['預設帳戶'];
                        saveAll();
                        location.reload(); // 重新整理頁面以套用
                    }
                } catch (err) { alert('檔案格式錯誤！'); }
            };
            reader.readAsText(file);
        }

        // --- 帳戶管理 ---
        function addUser() {
            var n = prompt('輸入新帳戶名稱:');
            if(n && !users.includes(n)) { users.push(n); saveUsers(); updateUserDropdown(); document.getElementById('filter-user').value = n; onUserChange(); }
        }
        function renameUser() {
            var oldName = document.getElementById('filter-user').value;
            var newName = prompt('更名為:', oldName);
            if(newName && newName !== oldName) {
                users = users.map(u => u === oldName ? newName : u);
                records.forEach(r => { if(r.user === oldName) r.user = newName; });
                if(marketPrices[oldName]) { marketPrices[newName] = marketPrices[oldName]; delete marketPrices[oldName]; }
                if(assetHistory[oldName]) { assetHistory[newName] = assetHistory[oldName]; delete assetHistory[oldName]; }
                saveAll(); location.reload();
            }
        }
        function deleteUser() {
            var user = document.getElementById('filter-user').value;
            if(users.length <= 1) return alert('需保留一個帳戶');
            if(confirm('確定刪除「'+user+'」？')){
                records = records.filter(r => r.user !== user);
                delete marketPrices[user]; delete assetHistory[user];
                users = users.filter(u => u !== user);
                saveAll(); location.reload();
            }
        }
        function saveUsers() { localStorage.setItem('invest_v8_users', JSON.stringify(users)); }
        function saveAll() {
            saveUsers();
            localStorage.setItem('invest_v8_recs', JSON.stringify(records));
            localStorage.setItem('invest_v8_prices', JSON.stringify(marketPrices));
            localStorage.setItem('invest_v8_hist', JSON.stringify(assetHistory));
        }
        function updateUserDropdown() {
            var s = document.getElementById('filter-user');
            var current = s.value;
            s.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
            if(users.includes(current)) s.value = current;
        }

        // --- 核心運作 ---
        function toggleFields() {
            var type = document.getElementById('form-type').value;
            document.getElementById('lbl-shares').innerText = type === 'withdraw' ? '賣出股數' : '買入股數';
            document.getElementById('lbl-amt').innerText = type === 'withdraw' ? '實際總拿回' : '實際總扣款';
        }
        function saveRecord() {
            var user = document.getElementById('filter-user').value;
            var target = document.getElementById('form-target').value.trim().toUpperCase();
            var date = document.getElementById('form-date').value;
            var type = document.getElementById('form-type').value;
            var shares = parseFloat(document.getElementById('form-shares').value) || 0;
            var amount = parseFloat(document.getElementById('form-amount').value) || 0;
            var editIdx = parseInt(document.getElementById('form-edit-index').value);
            if(!target || !date || shares <= 0) return alert('請填寫完整');
            var data = { user, target, date, type, shares: type === 'withdraw' ? -shares : shares, amount: type === 'withdraw' ? -amount : amount };
            if(editIdx === -1) records.push(data);
            else { records[editIdx] = data; cancelEdit(); }
            localStorage.setItem('invest_v8_recs', JSON.stringify(records));
            updateTargetDropdowns(); render();
            document.getElementById('form-target').value = ''; document.getElementById('form-shares').value = ''; document.getElementById('form-amount').value = '';
        }
        function updateAllMarketValues() {
            var user = document.getElementById('filter-user').value;
            var inputs = document.getElementsByClassName('sync-price-input');
            if(!marketPrices[user]) marketPrices[user] = {};
            for(var i=0; i<inputs.length; i++) {
                var code = inputs[i].dataset.code;
                var p = parseFloat(inputs[i].value) || 0;
                if(p > 0) marketPrices[user][code] = p;
            }
            localStorage.setItem('invest_v8_prices', JSON.stringify(marketPrices));
            var stats = calculateStats(user, 'ALL');
            var today = new Date().toISOString().split('T')[0];
            if(!assetHistory[user]) assetHistory[user] = [];
            var exist = assetHistory[user].findIndex(h => h.date === today);
            var snap = { date: today, value: stats.totalValue, cost: stats.totalCost };
            if(exist !== -1) assetHistory[user][exist] = snap;
            else assetHistory[user].push(snap);
            assetHistory[user].sort((a,b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('invest_v8_hist', JSON.stringify(assetHistory));
            render(); alert('走勢已更新！');
        }
        function calculateStats(user, filterTarget) {
            var userRecs = records.filter(r => r.user === user);
            var prices = marketPrices[user] || {};
            var portfolio = {};
            var totalCost = 0, totalValue = 0;
            userRecs.forEach(r => {
                if(!portfolio[r.target]) portfolio[r.target] = { shares: 0, cost: 0 };
                portfolio[r.target].shares += r.shares;
                portfolio[r.target].cost += r.amount;
            });
            for(var code in portfolio){
                if(filterTarget === 'ALL' || code === filterTarget){
                    if(portfolio[code].shares > 0.001){
                        totalCost += portfolio[code].cost;
                        totalValue += portfolio[code].shares * (prices[code] || 0);
                    }
                }
            }
            return { totalCost, totalValue };
        }
        function render() {
            var user = document.getElementById('filter-user').value;
            var filter = document.getElementById('filter-target').value || 'ALL';
            var stats = calculateStats(user, filter);
            document.getElementById('stat-net').innerText = '$' + Math.round(stats.totalCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(stats.totalValue).toLocaleString();
            var roiAmt = stats.totalValue - stats.totalCost;
            var roiPer = stats.totalCost > 0 ? (roiAmt / stats.totalCost * 100).toFixed(2) : '0.00';
            var roiDiv = document.getElementById('stat-roi');
            roiDiv.innerText = `${roiAmt >= 0 ? '+' : ''}${Math.round(roiAmt).toLocaleString()} (${roiPer}%)`;
            roiDiv.className = roiAmt >= 0 ? 'roi-up' : 'roi-down';
            var list = document.getElementById('records-list'); list.innerHTML = '';
            var displayRecs = records.map((r, i) => ({...r, idx: i}))
                                     .filter(r => r.user === user && (filter === 'ALL' || r.target === filter))
                                     .sort((a,b) => new Date(b.date) - new Date(a.date));
            displayRecs.forEach(r => {
                list.innerHTML += `<div class="item">
                    <div><span class="tag">${r.target}</span> <small>${r.date}</small></div>
                    <div><span style="font-size:13px; font-weight:bold;">$${Math.abs(r.amount).toLocaleString()}</span>
                    <button class="action-btn" onclick="editRecord(${r.idx})">改</button>
                    <button class="action-btn" onclick="deleteRecord(${r.idx})" style="color:red">刪</button></div>
                </div>`;
            });
            var syncList = document.getElementById('quick-sync-list'); syncList.innerHTML = '';
            var port = {};
            records.filter(r => r.user === user).forEach(r => { port[r.target] = (port[r.target] || 0) + r.shares; });
            for(var code in port){ if(port[code] > 0.001){
                syncList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <span style="font-size:13px;">${code} (${port[code].toFixed(1)})</span>
                    <input type="number" class="sync-price-input" data-code="${code}" value="${marketPrices[user][code] || ''}" style="width:100px; margin:0; padding:6px;">
                </div>`;
            }}
            drawChart(user);
        }
        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var data = assetHistory[user] || [];
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(h => h.date),
                    datasets: [
                        { label: '市值', data: data.map(h => h.value), borderColor: '#3a5fcd', backgroundColor: 'rgba(58,95,205,0.1)', fill: true, tension: 0.3 },
                        { label: '成本', data: data.map(h => h.cost), borderColor: '#ccc', borderDash: [5,5], tension: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
        function editRecord(idx) {
            var r = records[idx];
            document.getElementById('form-edit-index').value = idx;
            document.getElementById('form-target').value = r.target;
            document.getElementById('form-date').value = r.date;
            document.getElementById('form-type').value = r.type;
            document.getElementById('form-shares').value = Math.abs(r.shares);
            document.getElementById('form-amount').value = Math.abs(r.amount);
            document.getElementById('form-title').innerText = '✏️ 修改紀錄';
            document.getElementById('btn-submit').innerText = '儲存修改';
            document.getElementById('btn-cancel').style.display = 'block';
            toggleFields(); window.scrollTo(0,0);
        }
        function cancelEdit() {
            document.getElementById('form-edit-index').value = -1;
            document.getElementById('form-title').innerText = '✨ 新增投資紀錄';
            document.getElementById('btn-submit').innerText = '確認儲存紀錄';
            document.getElementById('btn-cancel').style.display = 'none';
        }
        function deleteRecord(idx) { if(confirm('刪除？')){ records.splice(idx, 1); localStorage.setItem('invest_v8_recs', JSON.stringify(records)); updateTargetDropdowns(); render(); }}
        function updateTargetDropdowns() {
            var user = document.getElementById('filter-user').value;
            var tgs = [...new Set(records.filter(r => r.user === user).map(r => r.target))];
            document.getElementById('filter-target').innerHTML = '<option value="ALL">全部標的</option>' + tgs.map(t => `<option value="${t}">${t}</option>`).join('');
        }
        function onUserChange() { updateTargetDropdowns(); render(); }
        init();
    </script>
</body>
</html>
