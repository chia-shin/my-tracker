<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢分析系統 - 終極修復版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root { --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f; --border: #e0e0e0; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding-bottom: 70px; color: #2c3e50; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #fff; display: flex; border-top: 1px solid #ddd; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #7f8c8d; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .box { background: #fff; border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 15px; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: block; }
        label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px 0; font-weight: 600; }
        input, select { width: 100%; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; -webkit-appearance: none; }
        .grid-2 { display: flex; gap: 10px; margin-top: 10px; }
        .grid-2 > div { flex: 1; }
        .dash-val { font-size: 22px; font-weight: 800; }
        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; width: 100%; }
        .btn-main { background: var(--primary); color: #fff; }
        .btn-sub { background: #f1f2f6; border: 1px solid #ccc; color: #333; }
        .btn-danger { background: var(--danger); color: #fff; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #fff; }
        .tag-buy { background: var(--danger); }
        .tag-sell { background: var(--success); }
        .roi-up { color: var(--danger); } .roi-down { color: var(--success); }
        .type-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #ccc; margin-top: 6px; }
        .type-btn { flex: 1; height: 40px; background: #f1f2f6; color: #333; font-weight: bold; border-radius: 0; text-align: center; line-height: 40px; cursor: pointer; }
        .type-btn.active-buy { background: var(--danger); color: white; }
        .type-btn.active-sell { background: var(--success); color: white; }
        .btn-inline-del { background: none; color: #999; border: 1px solid #ccc; padding: 4px 8px; width: auto; font-size: 11px; border-radius: 4px; margin-left: 10px; font-weight: normal; }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <h2 style="text-align:center;">🏠 我的投資首頁</h2>
        <div class="box" style="border-left: 5px solid var(--primary);">
            <select id="user-select" onchange="onUserChange()"></select>
        </div>
        <div class="box">
            <div class="grid-2">
                <div><label>庫存總市值</label><div id="stat-value" class="dash-val" style="color:var(--primary)">$0</div></div>
                <div><label>庫存總成本</label><div id="stat-net" class="dash-val">$0</div></div>
            </div>
            <div id="stat-roi" style="margin-top:10px; font-weight:bold; border-top:1px dashed #ddd; padding-top:10px;">$0 (0%)</div>
        </div>
        <div class="box">
            <span class="box-title">📊 資產趨勢圖</span>
            <div class="chart-container"><canvas id="assetChart"></canvas></div>
        </div>
        <div class="box">
            <span class="box-title">➕ 快速新增交易</span>
            <label>交易類型</label>
            <div class="type-toggle">
                <div id="toggle-buy" class="type-btn active-buy" onclick="setTxType('BUY')">買進 (BUY)</div>
                <div id="toggle-sell" class="type-btn" onclick="setTxType('SELL')">賣出 (SELL)</div>
            </div>
            <input type="hidden" id="f-type" value="BUY">
            <label>標的</label><input type="text" id="f-target" placeholder="例如: 00675L" style="text-transform: uppercase;">
            <label>日期</label><input type="date" id="f-date">
            <div class="grid-2">
                <div><label>股數</label><input type="number" id="f-shares" inputmode="decimal" placeholder="0"></div>
                <div><label>總金額</label><input type="number" id="f-amount" inputmode="decimal" placeholder="0"></div>
            </div>
            <button class="btn-main" style="margin-top:15px;" onclick="quickSave()">儲存交易紀錄</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <h2 style="text-align:center;">📜 歷史管理</h2>
        <div class="box" style="background:#fffdf9; border-left:5px solid var(--warning);">
            <span class="box-title" style="color:var(--warning);">🕒 歷史點位資產補錄</span>
            <label>選擇歷史日期</label>
            <input type="date" id="sync-history-date" onchange="renderSyncPrices()">
            <div id="sync-price-list" style="margin-top:10px;"></div>
            <button class="btn-main" style="background:var(--warning); margin-top:10px;" onclick="saveHistoryPoint()">💾 儲存該日歷史快照</button>
        </div>
        <div class="box">
            <span class="box-title">📋 交易明細</span>
            <div id="records-list"></div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <h2 style="text-align:center;">⚙️ 系統設定</h2>
        <div class="box">
            <span class="box-title">👤 帳戶管理</span>
            <div class="grid-2" style="margin-bottom: 12px;">
                <input type="text" id="new-user-name" placeholder="輸入帳戶名稱" style="flex: 2;">
                <button class="btn-main" id="btn-user-action" onclick="addUser()" style="flex: 1; height: 45px;">新增帳戶</button>
            </div>
            <div id="user-management-list"></div>
        </div>
        <div class="box">
            <span class="box-title">💾 資料管理</span>
            <button onclick="exportData()" class="btn-sub" style="margin-bottom:10px;">📤 匯出備份 (JSON)</button>
            <button onclick="document.getElementById('importFile').click()" class="btn-sub">📥 匯入資料 (JSON)</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)">首頁</div>
        <div class="nav-item" onclick="switchPage('history', this)">歷史</div>
        <div class="nav-item" onclick="switchPage('settings', this)">設定</div>
    </div>

    <script>
        // --- 1. 資料存取 ---
        function getStore(key) { return JSON.parse(localStorage.getItem('v12_'+key) || localStorage.getItem('v11_'+key) || 'null'); }
        var records = getStore('recs') || [];
        var marketPrices = getStore('prices') || {}; 
        var assetHistory = getStore('hist') || {};   
        var users = getStore('users') || ['預設帳戶'];
        var chartInstance = null;

        function saveAll() {
            localStorage.setItem('v12_recs', JSON.stringify(records));
            localStorage.setItem('v12_prices', JSON.stringify(marketPrices));
            localStorage.setItem('v12_hist', JSON.stringify(assetHistory));
            localStorage.setItem('v12_users', JSON.stringify(users));
        }

        // --- 2. 資料結構修復 (防止 deposit 變賣出) ---
        function repairData() {
            let changed = false;
            records.forEach(r => {
                if (r.type !== 'BUY' && r.type !== 'SELL') {
                    r.type = 'BUY'; 
                    changed = true;
                }
            });
            if (changed) saveAll();
        }

        function init() {
            repairData();
            updateUserDropdown();
            render();
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('sync-history-date').value = new Date().toISOString().split('T')[0];
        }

        // --- 3. 頁面邏輯 ---
        function switchPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(pageId === 'home') render();
            if(pageId === 'history') { renderHistoryList(); renderSyncPrices(); }
            if(pageId === 'settings') renderSettingsUsers();
        }

        function setTxType(type) {
            document.getElementById('f-type').value = type;
            document.getElementById('toggle-buy').className = 'type-btn' + (type === 'BUY' ? ' active-buy' : '');
            document.getElementById('toggle-sell').className = 'type-btn' + (type === 'SELL' ? ' active-sell' : '');
        }

        function calculatePortfolio(user, untilDate = '9999-12-31') {
            var filteredRecs = records.filter(r => r.user === user && r.date <= untilDate).sort((a, b) => new Date(a.date) - new Date(b.date));
            var port = {};
            filteredRecs.forEach(r => {
                if (!port[r.target]) port[r.target] = { shares: 0, avgCost: 0 };
                if (r.type === 'SELL') {
                    port[r.target].shares -= r.shares;
                } else {
                    var totalCost = (port[r.target].shares * port[r.target].avgCost) + r.amount;
                    port[r.target].shares += r.shares;
                    port[r.target].avgCost = port[r.target].shares > 0 ? (totalCost / port[r.target].shares) : 0;
                }
            });
            return port;
        }

        function render() {
            var user = document.getElementById('user-select').value;
            if(!user) return;
            var prs = marketPrices[user] || {};
            var port = calculatePortfolio(user);
            var tCost = 0; var tValue = 0;
            for(var c in port) {
                tCost += port[c].shares * port[c].avgCost;
                tValue += port[c].shares * (prs[c] || 0);
            }
            document.getElementById('stat-net').innerText = '$' + Math.round(tCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(tValue).toLocaleString();
            var roi = tValue - tCost;
            var per = tCost > 0 ? (roi/tCost*100).toFixed(2) : '0';
            document.getElementById('stat-roi').innerText = `${roi>=0?'+':''}${Math.round(roi).toLocaleString()} (${per}%)`;
            document.getElementById('stat-roi').className = roi >= 0 ? 'roi-up' : 'roi-down';
            drawChart(user);
        }

        function renderHistoryList() {
            var user = document.getElementById('user-select').value;
            var list = document.getElementById('records-list');
            list.innerHTML = '';
            var indexedRecs = records.map((r, index) => ({ r, index }));
            var filtered = indexedRecs.filter(item => item.r.user === user).sort((a,b) => new Date(b.r.date) - new Date(a.r.date));
            filtered.forEach(item => {
                var r = item.r;
                var type = r.type === 'SELL' ? 'SELL' : 'BUY';
                list.innerHTML += `<div class="item">
                    <div><span class="tag ${type==='BUY'?'tag-buy':'tag-sell'}">${type==='BUY'?'買進':'賣出'} · ${r.target}</span> <small>${r.date}</small>
                    <button class="btn-inline-del" onclick="deleteRecord(${item.index})">🗑️</button></div>
                    <div style="text-align:right;"><b>$${Math.round(r.amount).toLocaleString()}</b><br><small>${r.shares.toLocaleString()} 股</small></div>
                </div>`;
            });
        }

        function deleteRecord(index) {
            if(confirm('確定要刪除這筆紀錄嗎？')) { records.splice(index, 1); saveAll(); render(); renderHistoryList(); }
        }

        // --- 4. 圖表繪製 (修復 1970 問題) ---
        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var rawData = assetHistory[user] || [];
            
            // 過濾掉不合理的年份並排序
            var cleanData = rawData.filter(h => {
                var d = new Date(h.date);
                return d.getFullYear() > 2000;
            }).sort((a, b) => new Date(a.date) - new Date(b.date));

            if (chartInstance) chartInstance.destroy();
            if (cleanData.length === 0) return;

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: '市值', data: cleanData.map(h => ({x:h.date, y:h.value})), borderColor: '#3a5fcd', backgroundColor: 'rgba(58,95,205,0.1)', fill: true, tension: 0.3 },
                        { label: '成本', data: cleanData.map(h => ({x:h.date, y:h.cost})), borderColor: '#999', borderDash: [5,5], tension: 0 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { 
                        x: { type: 'time', time: { unit: 'month', displayFormats: { month: 'yyyy-MM' } }, min: cleanData[0].date },
                        y: { beginAtZero: false }
                    },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // --- 5. 帳戶與同步功能 ---
        function renderSyncPrices() {
            var user = document.getElementById('user-select').value;
            var date = document.getElementById('sync-history-date').value;
            var port = calculatePortfolio(user, date);
            var targets = Object.keys(port).filter(t => port[t].shares > 0);
            var container = document.getElementById('sync-price-list');
            container.innerHTML = targets.length ? '<label>該日收盤單價：</label>' + targets.map(t => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="font-size:14px;">${t} (${Math.round(port[t].shares)}股)</span>
                    <input type="number" class="sync-price-input" data-code="${t}" style="width:120px;">
                </div>`).join('') : '<p style="color:gray;text-align:center;">無庫存</p>';
        }

        function saveHistoryPoint() {
            var user = document.getElementById('user-select').value;
            var date = document.getElementById('sync-history-date').value;
            var inputs = document.getElementsByClassName('sync-price-input');
            var dayVal = 0; var dayCost = 0;
            var port = calculatePortfolio(user, date);
            for(let input of inputs) {
                var p = parseFloat(input.value) || 0;
                var code = input.dataset.code;
                dayVal += port[code].shares * p;
                dayCost += port[code].shares * port[code].avgCost;
            }
            if(!assetHistory[user]) assetHistory[user] = [];
            var exist = assetHistory[user].findIndex(h => h.date === date);
            var snap = { date, value: Math.round(dayVal), cost: Math.round(dayCost) };
            if(exist > -1) assetHistory[user][exist] = snap; else assetHistory[user].push(snap);
            saveAll(); render(); alert('儲存成功');
        }

        function quickSave() {
            var user = document.getElementById('user-select').value;
            var type = document.getElementById('f-type').value;
            var target = document.getElementById('f-target').value.toUpperCase().trim();
            var date = document.getElementById('f-date').value;
            var shares = parseFloat(document.getElementById('f-shares').value);
            var amount = parseFloat(document.getElementById('f-amount').value);
            if(!target || isNaN(shares) || isNaN(amount)) return alert('請填寫完整');
            records.push({ user, type, target, date, shares, amount });
            saveAll(); render(); alert('儲存成功');
            document.getElementById('f-target').value = '';
            document.getElementById('f-shares').value = '';
            document.getElementById('f-amount').value = '';
        }

        function updateUserDropdown() {
            var sel = document.getElementById('user-select');
            sel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
        }

        function renderSettingsUsers() {
            var list = document.getElementById('user-management-list');
            list.innerHTML = users.map(u => `<div class="item"><span>${u}</span><button class="btn-danger" style="width:auto;padding:5px 10px;" onclick="deleteUser('${u}')">刪除</button></div>`).join('');
        }

        function addUser() {
            var name = document.getElementById('new-user-name').value.trim();
            if(name && !users.includes(name)) { users.push(name); saveAll(); updateUserDropdown(); renderSettingsUsers(); }
        }

        function deleteUser(name) {
            if(users.length > 1 && confirm('確定刪除？')) { users = users.filter(u => u !== name); saveAll(); updateUserDropdown(); renderSettingsUsers(); }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({recs:records, prices:marketPrices, hist:assetHistory, users:users})], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `投資備份_${new Date().toISOString().split('T')[0]}.json`; a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = function(re) {
                const data = JSON.parse(re.target.result);
                records = data.recs; marketPrices = data.prices; assetHistory = data.hist; users = data.users;
                saveAll(); location.reload();
            };
            reader.readAsText(e.target.files[0]);
        }

        function onUserChange() { render(); }
        init();
    </script>
</body>
</html>
