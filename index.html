<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="多標的記帳">
    <title>多標的投資記帳管理系統</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #4472C4;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333333;
            --deposit: #2ecc71;
            --withdraw: #e74c3c;
            --update: #f39c12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; padding-bottom: 40px; padding-top: calc(20px + env(safe-area-inset-top)); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 15px; color: var(--primary); }
        .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stats-val { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; margin-top: 10px; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 5px; -webkit-appearance: none; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        button:active { opacity: 0.8; }
        button.export-btn { background: #27ae60; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .record-item:last-child { border-bottom: none; }
        .badge { padding: 3px 6px; border-radius: 4px; color: white; font-size: 0.75rem; font-weight: bold; }
        .target-badge { background: #7f8c8d; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .bg-deposit { background: var(--deposit); }
        .bg-withdraw { background: var(--withdraw); }
        .bg-update { background: var(--update); }
        .del-btn { background: none; color: #e74c3c; width: auto; margin: 0; padding: 5px 10px; border: 1px solid #e74c3c; }
        .filter-select { background: #fff; border: 2px solid var(--primary); font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <h1>📈 多標的投資記帳系統</h1>

    <!-- 篩選標的 -->
    <div style="margin-bottom: 15px;">
        <label style="margin-top:0;">🔍 切換檢視標的：</label>
        <select id="filter-target" class="filter-select" onchange="render()"></select>
    </div>

    <!-- 數據概覽 -->
    <div class="card grid-2">
        <div>
            <label>最新市值總計</label>
            <div class="stats-val" id="stat-value" style="color:var(--update)">$0</div>
        </div>
        <div>
            <label>累計淨投入</label>
            <div class="stats-val" id="stat-net">$0</div>
        </div>
    </div>

    <!-- 新增紀錄 -->
    <div class="card">
        <h3>✨ 新增投資紀錄</h3>
        
        <label>投資標的名稱</label>
        <input type="text" id="form-target" placeholder="例如：台積電、0050、美股富達" list="target-suggestions">
        <datalist id="target-suggestions"></datalist>

        <label>日期</label>
        <input type="date" id="form-date">
        
        <label>交易類型</label>
        <select id="form-type" onchange="toggleFields()">
            <option value="deposit">存款 / 投入金額</option>
            <option value="withdraw">提款 / 贖回金額</option>
            <option value="value_update">更新最新市值</option>
        </select>

        <div id="amt-group">
            <label>金額</label>
            <input type="number" id="form-amount" placeholder="輸入金額" inputmode="decimal">
        </div>

        <label>說明</label>
        <input type="text" id="form-desc" placeholder="摘要備註">

        <button onclick="addRecord()">確認儲存</button>
    </div>

    <!-- 功能按鍵 -->
    <div style="margin-bottom: 15px;">
        <button class="export-btn" onclick="exportToExcel()">💾 匯出 Excel 試算表</button>
    </div>

    <!-- 紀錄列表 -->
    <div class="card">
        <h3>📋 歷史紀錄明細</h3>
        <div id="records-list" style="margin-top: 10px;"></div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('multi_investment_records')) || [];

        // 初始化日期
        document.getElementById('form-date').value = new Date().toISOString().split('T')[0];

        function toggleFields() {
            const type = document.getElementById('form-type').value;
            document.querySelector('#amt-group label').innerText = (type === 'value_update') ? '該標的最新總市值' : '金額';
        }

        function saveAndRefresh() {
            localStorage.setItem('multi_investment_records', JSON.stringify(records));
            updateTargetDropdowns();
            render();
        }

        // 更新篩選器與輸入建議清單
        function updateTargetDropdowns() {
            const targets = [...new Set(records.map(r => r.target).filter(Boolean))];
            
            // 更新篩選下拉選單
            const filterSelect = document.getElementById('filter-target');
            const currentFilter = filterSelect.value || 'ALL';
            filterSelect.innerHTML = '<option value="ALL">顯示所有標的</option>';
            targets.forEach(t => {
                filterSelect.innerHTML += `<option value="${t}">${t}</option>`;
            });
            if (targets.includes(currentFilter) || currentFilter === 'ALL') {
                filterSelect.value = currentFilter;
            }

            // 更新輸入建議
            const datalist = document.getElementById('target-suggestions');
            datalist.innerHTML = '';
            targets.forEach(t => {
                datalist.innerHTML += `<option value="${t}">`;
            });
        }

        function addRecord() {
            const target = document.getElementById('form-target').value.trim();
            const date = document.getElementById('form-date').value;
            const type = document.getElementById('form-type').value;
            let amount = parseFloat(document.getElementById('form-amount').value) || 0;
            const desc = document.getElementById('form-desc').value.trim();

            if (!target) return alert('請輸入投資標的名稱');
            if (!date) return alert('請選擇日期');
            if (amount <= 0) return alert('請輸入有效金額');

            let current_value = 0;
            if (type === 'withdraw') {
                amount = -amount;
            } else if (type === 'value_update') {
                current_value = amount;
                amount = 0;
            }

            records.push({ target, date, amount, transaction_type: type, description: desc, current_value });
            
            document.getElementById('form-amount').value = '';
            document.getElementById('form-desc').value = '';
            saveAndRefresh();
        }

        function deleteRecord(index) {
            if (confirm('⚠️ 確定要刪除此筆紀錄嗎？')) {
                records.splice(index, 1);
                saveAndRefresh();
            }
        }

        function render() {
            const filterTarget = document.getElementById('filter-target').value || 'ALL';
            const list = document.getElementById('records-list');
            list.innerHTML = '';
            
            let totalNetInput = 0;
            let totalLatestValue = 0;

            // 計算各別標的的最新市值
            const targetLatestValueMap = {};
            // 按日期正序排列計算，確保最後一筆是最新市值
            [...records].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(r => {
                if (r.transaction_type === 'value_update') {
                    targetLatestValueMap[r.target] = r.current_value;
                }
            });

            // 計算數據摘要
            records.forEach(r => {
                const isMatch = (filterTarget === 'ALL' || r.target === filterTarget);
                if (isMatch && (r.transaction_type === 'deposit' || r.transaction_type === 'withdraw')) {
                    totalNetInput += r.amount;
                }
            });

            if (filterTarget === 'ALL') {
                totalLatestValue = Object.values(targetLatestValueMap).reduce((a, b) => a + b, 0);
            } else {
                totalLatestValue = targetLatestValueMap[filterTarget] || 0;
            }

            document.getElementById('stat-net').innerText = `$${totalNetInput.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('stat-value').innerText = `$${totalLatestValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            // 篩選與排序明細（由新到舊）
            const displayedRecords = records
                .map((r, idx) => ({...r, originalIdx: idx}))
                .filter(r => filterTarget === 'ALL' || r.target === filterTarget)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            if(displayedRecords.length === 0) {
                list.innerHTML = '<p style="color:#999; text-align:center; padding:10px;">暫無紀錄</p>';
                return;
            }

            displayedRecords.forEach(r => {
                const item = document.createElement('div');
                item.className = 'record-item';
                
                let typeStr = '存款', badgeClass = 'bg-deposit', displayAmt = `$${Math.abs(r.amount).toLocaleString()}`;
                if (r.transaction_type === 'withdraw') { typeStr = '提款'; badgeClass = 'bg-withdraw'; }
                if (r.transaction_type === 'value_update') { typeStr = '市值'; badgeClass = 'bg-update'; displayAmt = `$${r.current_value.toLocaleString()}`; }

                item.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">
                            <span class="target-badge">${r.target}</span> ${r.date} 
                            <span class="badge ${badgeClass}">${typeStr}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#666; margin-top:2px;">${r.description || '無備註'}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:bold;">${displayAmt}</span>
                        <button class="del-btn" onclick="deleteRecord(${r.originalIdx})">刪除</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function exportToExcel() {
            if(records.length === 0) return alert('沒有資料可匯出');
            
            const data = records.map(r => ({
                "投資標的": r.target,
                "日期": r.date,
                "金額": r.amount,
                "交易類型": r.transaction_type,
                "說明": r.description,
                "目前市值": r.current_value
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "投資紀錄明細");
            
            worksheet['!cols'] = [{wch:15}, {wch:15}, {wch:15}, {wch:15}, {wch:30}, {wch:15}];
            XLSX.writeFile(workbook, "portfolio_records.xlsx");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // 初始化
        updateTargetDropdowns();
        render();
    </script>
</body>
</html>
