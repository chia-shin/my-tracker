<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢管理 - 自動歷史成本版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f;
            --border-color: #e0e0e0; --text-sub: #7f8c8d;
        }
        body { font-family: -apple-system, sans-serif; background-color: #f8f9fa; padding: 15px; margin: 0; color: #2c3e50; -webkit-font-smoothing: antialiased; }
        .box { background: #fff; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; width: 100%; clear: both; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: block; }
        label { display: block; font-size: 13px; color: var(--text-sub); margin: 12px 0 6px 0; font-weight: 600; }
        input, select { 
            display: block !important; width: 100% !important; height: 48px; padding: 10px 12px; 
            border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box !important;
            background-color: #fff !important; -webkit-appearance: none; appearance: none; margin: 0;
        }
        .grid-2 { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        .grid-2 > div { flex: 1; min-width: 0; }
        .dash-val { font-size: 22px; font-weight: 800; }
        .roi-up { color: var(--danger); }
        .roi-down { color: var(--success); }
        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
        .btn-main { background: var(--primary); color: #fff; width: 100%; margin-top: 15px; }
        .btn-backup { background: #f1f2f6; color: #2c3e50; font-size: 12px; flex: 1; border: 1px solid #ccc; }
        .chart-container { position: relative; height: 220px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { background: #718093; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .action-btn { background: none; border: 1px solid #ccc; padding: 4px 8px; font-size: 12px; color: #666; width: auto; margin-left: 5px; }
        .hint { font-size: 11px; color: var(--warning); margin-top: 4px; font-weight: normal; }
    </style>
</head>
<body>

    <h2 style="text-align:center; font-size: 18px;">📈 專業投資走勢管理</h2>

    <div class="box" style="border-left: 5px solid var(--success);">
        <select id="filter-user" onchange="onUserChange()"></select>
    </div>

    <div class="box">
        <div class="grid-2">
            <div>
                <label>總市值</label>
                <div id="stat-value" class="dash-val" style="color: var(--primary);">$0</div>
            </div>
            <div>
                <label>目前總投入</label>
                <div id="stat-net" class="dash-val">$0</div>
            </div>
        </div>
        <div id="stat-roi" style="margin-top: 10px; font-weight: bold; border-top: 1px dashed #ddd; padding-top: 10px;">$0 (0.00%)</div>
    </div>

    <div class="box">
        <span class="box-title">📊 資產與投入趨勢</span>
        <div class="chart-container">
            <canvas id="assetChart"></canvas>
        </div>
    </div>

    <div class="box" style="background: #fffdf9; border-left: 5px solid var(--warning);">
        <span class="box-title" style="color: var(--warning);">🕒 歷史點位補錄 (自動計算當日成本)</span>
        <div class="input-group">
            <label>紀錄日期 (補哪天就選哪天)</label>
            <input type="date" id="sync-history-date">
            <div class="hint">* 系統會自動過濾該日期之後的交易，計算當日真實投入</div>
        </div>
        <div id="quick-sync-list" style="margin-top:15px;"></div>
        <button class="btn-main" style="background: var(--warning);" onclick="updateAllMarketValues()">💾 儲存該日數據並更新走勢</button>
    </div>

    <div class="box">
        <span class="box-title" id="form-title">✨ 新增投資紀錄</span>
        <input type="hidden" id="form-edit-index" value="-1">
        <label>投資標的</label>
        <input type="text" id="form-target" placeholder="例如: QLD" style="text-transform: uppercase;">
        <label>交易日期</label>
        <input type="date" id="form-date">
        <label>交易類型</label>
        <select id="form-type" onchange="toggleFields()">
            <option value="deposit">買入 (支付款項)</option>
            <option value="withdraw">賣出 (拿回款項)</option>
        </select>
        <div class="grid-2">
            <div><label id="lbl-shares">股數</label><input type="number" id="form-shares" inputmode="decimal" placeholder="0"></div>
            <div><label id="lbl-amt">總金額</label><input type="number" id="form-amount" inputmode="decimal" placeholder="0"></div>
        </div>
        <button class="btn-main" onclick="saveRecord()" id="btn-submit">確認儲存紀錄</button>
        <button id="btn-cancel" onclick="cancelEdit()" style="display:none; width:100%; margin-top:8px; background:#718093; color:white;">取消修改</button>
    </div>

    <div class="box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="box-title" style="margin:0;">📋 交易明細</span>
            <select id="filter-target" onchange="render()" style="width:auto; height:32px; font-size:12px; padding:0 8px;"></select>
        </div>
        <div id="records-list"></div>
    </div>

    <div class="box" style="background: #f8f9fa;">
        <div class="grid-2">
            <button class="btn-backup" onclick="exportData()">📤 匯出備份</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 匯入備份</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>

    <script>
        var records = JSON.parse(localStorage.getItem('invest_v9_recs')) || [];
        var marketPrices = JSON.parse(localStorage.getItem('invest_v9_prices')) || {};
        var assetHistory = JSON.parse(localStorage.getItem('invest_v9_hist')) || {};
        var users = JSON.parse(localStorage.getItem('invest_v9_users')) || ['預設帳戶'];
        var chartInstance = null;

        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('form-date').value = today;
            document.getElementById('sync-history-date').value = today;
            updateUserDropdown();
            onUserChange(true); 
        }

        function saveAll() { 
            localStorage.setItem('invest_v9_users', JSON.stringify(users));
            localStorage.setItem('invest_v9_recs', JSON.stringify(records));
            localStorage.setItem('invest_v9_prices', JSON.stringify(marketPrices));
            localStorage.setItem('invest_v9_hist', JSON.stringify(assetHistory));
        }

        // 核心更新：自動過濾日期的計算
        function updateAllMarketValues() {
            var user = document.getElementById('filter-user').value;
            var targetDate = document.getElementById('sync-history-date').value; 
            var inputs = document.getElementsByClassName('sync-price-input');
            if(!targetDate) return alert('請選擇日期');

            // 1. 回溯過濾：只抓取該日期以前的交易
            var historyLimit = new Date(targetDate);
            var filteredRecs = records.filter(r => r.user === user && new Date(r.date) <= historyLimit);
            
            var port = {}; 
            var dayCost = 0;
            var dayValue = 0;

            filteredRecs.forEach(r => {
                if(!port[r.target]) port[r.target] = { shares: 0, netPaid: 0 };
                port[r.target].shares += r.shares;
                port[r.target].netPaid += r.amount;
            });

            // 2. 根據輸入的價格算市值
            for(var i=0; i<inputs.length; i++) {
                var c = inputs[i].dataset.code; 
                var p = parseFloat(inputs[i].value) || 0;
                if(port[c]) {
                    dayValue += (port[c].shares * p);
                    dayCost += port[c].netPaid;
                }
            }
            
            // 如果是今天，更新全局市價
            if(targetDate === new Date().toISOString().split('T')[0]) {
                if(!marketPrices[user]) marketPrices[user] = {};
                for(var i=0; i<inputs.length; i++) {
                    marketPrices[user][inputs[i].dataset.code] = parseFloat(inputs[i].value) || 0;
                }
            }

            // 3. 儲存點位
            if(!assetHistory[user]) assetHistory[user] = [];
            var exist = assetHistory[user].findIndex(h => h.date === targetDate);
            var snap = { date: targetDate, value: Math.round(dayValue), cost: Math.round(dayCost) };

            if(exist !== -1) assetHistory[user][exist] = snap;
            else assetHistory[user].push(snap);

            assetHistory[user].sort((a,b) => new Date(a.date) - new Date(b.date));
            saveAll(); render(); alert('已存入 ' + targetDate + ' 的快照 (自動計算歷史成本)');
        }

        function calculateStats(user, filter) {
            var userRecs = records.filter(r => r.user === user);
            var prs = marketPrices[user] || {};
            var port = {}; 
            var totalCost = 0, totalValue = 0;
            userRecs.forEach(r => {
                if(!port[r.target]) port[r.target] = { shares: 0, netPaid: 0 };
                port[r.target].shares += r.shares;
                port[r.target].netPaid += r.amount;
            });
            for(var c in port) {
                if(filter === 'ALL' || c === filter) {
                    totalCost += port[c].netPaid;
                    totalValue += port[c].shares * (prs[c] || 0);
                }
            }
            return { totalCost, totalValue };
        }

        function render() {
            var user = document.getElementById('filter-user').value;
            var filter = document.getElementById('filter-target').value || 'ALL';
            var stats = calculateStats(user, filter);
            
            document.getElementById('stat-net').innerText = '$' + Math.round(stats.totalCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(stats.totalValue).toLocaleString();
            var roiAmt = stats.totalValue - stats.totalCost;
            var roiPer = stats.totalCost > 0 ? (roiAmt / stats.totalCost * 100).toFixed(2) : '0.00';
            document.getElementById('stat-roi').innerText = `${roiAmt >= 0 ? '+' : ''}${Math.round(roiAmt).toLocaleString()} (${roiPer}%)`;
            document.getElementById('stat-roi').className = roiAmt >= 0 ? 'roi-up' : 'roi-down';
            
            var list = document.getElementById('records-list'); list.innerHTML = '';
            records.map((r, i) => ({...r, idx: i}))
                   .filter(r => r.user === user && (filter === 'ALL' || r.target === filter))
                   .sort((a,b) => new Date(b.date) - new Date(a.date))
                   .forEach(r => {
                       var isW = r.shares < 0;
                       list.innerHTML += `<div class="item">
                           <div><span class="tag">${r.target}</span> <small style="color:${isW?'#2e7d32':'#d32f2f'}">${isW?'賣出':'買入'}</small> <small style="color:#999">${r.date}</small></div>
                           <div><b>$${Math.abs(r.amount).toLocaleString()}</b>
                           <button class="action-btn" onclick="editRecord(${r.idx})">改</button>
                           <button class="action-btn" onclick="deleteRecord(${r.idx})" style="color:red">刪</button></div>
                       </div>`;
                   });
            
            var syncList = document.getElementById('quick-sync-list'); syncList.innerHTML = '';
            var port = {}; 
            records.filter(r => r.user === user).forEach(r => { port[r.target] = (port[r.target] || 0) + r.shares; });
            for(var c in port) { 
                if(port[c] > 0.0001) {
                    syncList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:13px; font-weight:600;">${c} (${port[c].toFixed(1)})</span>
                        <input type="number" class="sync-price-input" data-code="${c}" value="${(marketPrices[user]||{})[c] || ''}" placeholder="輸入單價" style="width:140px; height:40px;">
                    </div>`;
                }
            }
            drawChart(user);
        }

        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var data = assetHistory[user] || [];
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(h => h.date),
                    datasets: [
                        { label: '市值', data: data.map(h => h.value), borderColor: '#3a5fcd', backgroundColor: 'rgba(58,95,205,0.1)', fill: true, tension: 0.3 },
                        { label: '投入成本', data: data.map(h => h.cost), borderColor: '#999', borderDash: [5,5], tension: 0, fill: false }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: false } },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } 
                }
            });
        }

        function saveRecord() {
            var user = document.getElementById('filter-user').value;
            var target = document.getElementById('form-target').value.trim().toUpperCase();
            var date = document.getElementById('form-date').value;
            var type = document.getElementById('form-type').value;
            var shares = parseFloat(document.getElementById('form-shares').value) || 0;
            var amount = parseFloat(document.getElementById('form-amount').value) || 0;
            var editIdx = parseInt(document.getElementById('form-edit-index').value);
            if(!target || !date || shares <= 0 || amount <= 0) return alert('請填寫完整');
            var data = { user, target, date, type, shares: type==='withdraw'?-shares:shares, amount: type==='withdraw'?-amount:amount };
            if(editIdx === -1) records.push(data); else { records[editIdx] = data; cancelEdit(); }
            saveAll(); updateTargetDropdowns(false); render();
        }

        function editRecord(idx) {
            var r = records[idx];
            document.getElementById('form-edit-index').value = idx;
            document.getElementById('form-target').value = r.target;
            document.getElementById('form-date').value = r.date;
            document.getElementById('form-type').value = r.shares < 0 ? 'withdraw' : 'deposit';
            document.getElementById('form-shares').value = Math.abs(r.shares);
            document.getElementById('form-amount').value = Math.abs(r.amount);
            document.getElementById('form-title').innerText = '✏️ 修改紀錄';
            document.getElementById('btn-submit').innerText = '儲存修改';
            document.getElementById('btn-cancel').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function cancelEdit() { 
            document.getElementById('form-edit-index').value = -1;
            document.getElementById('form-title').innerText = '✨ 新增投資紀錄';
            document.getElementById('btn-submit').innerText = '確認儲存紀錄';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        function deleteRecord(idx) { if(confirm('確定刪除？')){ records.splice(idx, 1); saveAll(); updateTargetDropdowns(false); render(); }}
        function updateTargetDropdowns(reset = true) {
            var user = document.getElementById('filter-user').value;
            var filterSelect = document.getElementById('filter-target');
            var tgs = [...new Set(records.filter(r => r.user === user).map(r => r.target))];
            filterSelect.innerHTML = '<option value="ALL">全部標的</option>' + tgs.map(t => `<option value="${t}">${t}</option>`).join('');
            if(reset) filterSelect.value = 'ALL';
        }
        function updateUserDropdown() { document.getElementById('filter-user').innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join(''); }
        function onUserChange(reset = true) { cancelEdit(); updateTargetDropdowns(reset); render(); }
        function exportData() {
            const blob = new Blob([JSON.stringify({recs:records, prices:marketPrices, hist:assetHistory, users:users})], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `投資備份_${new Date().toISOString().split('T')[0]}.json`; a.click();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = function(re) {
                const data = JSON.parse(re.target.result);
                if(confirm('匯入？')) { records=data.recs; marketPrices=data.prices; assetHistory=data.hist; users=data.users; saveAll(); location.reload(); }
            };
            reader.readAsText(e.target.files[0]);
        }
        function toggleFields() {
            var t = document.getElementById('form-type').value;
            document.getElementById('lbl-shares').innerText = t==='withdraw'?'賣出股數':'買入股數';
            document.getElementById('lbl-amt').innerText = t==='withdraw'?'拿回金額':'扣款金額';
        }
        init();
    </script>
</body>
</html>
