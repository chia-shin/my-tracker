<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢分析系統 - 全自動相容版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f;
            --border-color: #e0e0e0; --bg-light: #f8f9fa;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-light); margin: 0; padding-bottom: 70px; color: #2c3e50; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #fff; display: flex; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #7f8c8d; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .box { background: #fff; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 15px; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: block; }
        label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px 0; font-weight: 600; }
        input, select { width: 100% !important; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fff; }
        .grid-2 { display: flex; gap: 10px; margin-top: 10px; }
        .grid-2 > div { flex: 1; }
        .dash-val { font-size: 22px; font-weight: 800; }
        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
        .btn-main { background: var(--primary); color: #fff; width: 100%; }
        .btn-sub { background: #f1f2f6; border: 1px solid #ccc; width: 100%; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { background: #718093; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .roi-up { color: var(--danger); } .roi-down { color: var(--success); }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <h2 style="text-align:center;">🏠 我的投資首頁</h2>
        <div class="box" style="border-left: 5px solid var(--primary);">
            <select id="user-select" onchange="onUserChange()"></select>
        </div>
        <div class="box">
            <div class="grid-2">
                <div><label>總市值</label><div id="stat-value" class="dash-val" style="color:var(--primary)">$0</div></div>
                <div><label>目前投入</label><div id="stat-net" class="dash-val">$0</div></div>
            </div>
            <div id="stat-roi" style="margin-top:10px; font-weight:bold; border-top:1px dashed #ddd; padding-top:10px;">$0 (0%)</div>
        </div>
        <div class="box">
            <span class="box-title">📊 資產趨勢</span>
            <div class="chart-container"><canvas id="assetChart"></canvas></div>
        </div>
        <div class="box">
            <span class="box-title">➕ 快速新增交易</span>
            <label>標的</label><input type="text" id="f-target" placeholder="例如: 00675L" style="text-transform: uppercase;">
            <label>日期</label><input type="date" id="f-date">
            <div class="grid-2">
                <div><label>股數</label><input type="number" id="f-shares" inputmode="decimal"></div>
                <div><label>金額</label><input type="number" id="f-amount" inputmode="decimal"></div>
            </div>
            <button class="btn-main" style="margin-top:15px;" onclick="quickSave()">儲存交易</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <h2 style="text-align:center;">📜 歷史管理</h2>
        <div class="box" style="background:#fffdf9; border-left:5px solid var(--warning);">
            <span class="box-title">🕒 歷史點位補錄</span>
            <label>選擇日期</label>
            <input type="date" id="sync-history-date">
            <div id="sync-price-list" style="margin-top:10px;"></div>
            <button class="btn-main" style="background:var(--warning); margin-top:10px;" onclick="saveHistoryPoint()">儲存該日快照</button>
        </div>
        <div class="box">
            <span class="box-title">📋 交易明細</span>
            <div id="records-list"></div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <h2 style="text-align:center;">⚙️ 系統設定</h2>
        <div class="box">
            <span class="box-title">💾 資料備份與恢復</span>
            <div class="grid-2">
                <button onclick="exportData()" class="btn-sub">📤 匯出 JSON</button>
                <button onclick="document.getElementById('importFile').click()" class="btn-sub">📥 匯入 JSON</button>
            </div>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
            <p style="font-size:12px; color:gray; margin-top:10px;">* 如果匯入後沒反應，請確認帳戶選單是否切換到正確帳戶。</p>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)">首頁</div>
        <div class="nav-item" onclick="switchPage('history', this)">歷史</div>
        <div class="nav-item" onclick="switchPage('settings', this)">設定</div>
    </div>

    <script>
        // 自動偵測不同版本的標籤
        function getOldData(key) {
            return localStorage.getItem('v11_' + key) || 
                   localStorage.getItem('invest_v10_' + key) || 
                   localStorage.getItem('invest_v9_' + key);
        }

        var records = JSON.parse(getOldData('recs')) || [];
        var marketPrices = JSON.parse(getOldData('prices')) || {};
        var assetHistory = JSON.parse(getOldData('hist')) || {};
        var users = JSON.parse(getOldData('users')) || ['預設帳戶'];
        var chartInstance = null;

        function saveAll() {
            localStorage.setItem('v11_recs', JSON.stringify(records));
            localStorage.setItem('v11_prices', JSON.stringify(marketPrices));
            localStorage.setItem('v11_hist', JSON.stringify(assetHistory));
            localStorage.setItem('v11_users', JSON.stringify(users));
        }

        function init() {
            updateUserDropdown();
            render();
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('sync-history-date').value = new Date().toISOString().split('T')[0];
        }

        function switchPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(pageId === 'home') render();
            if(pageId === 'history') { renderHistoryList(); renderSyncPrices(); }
        }

        function render() {
            var user = document.getElementById('user-select').value;
            if(!user) return;
            var prs = marketPrices[user] || {};
            var port = {}; var tCost = 0; var tValue = 0;
            records.filter(r => r.user === user).forEach(r => {
                if(!port[r.target]) port[r.target] = { s: 0, c: 0 };
                port[r.target].s += r.shares; port[r.target].c += r.amount;
            });
            for(var c in port) {
                tCost += port[c].c; tValue += port[c].s * (prs[c] || 0);
            }
            document.getElementById('stat-net').innerText = '$' + Math.round(tCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(tValue).toLocaleString();
            var roi = tValue - tCost;
            var per = tCost > 0 ? (roi/tCost*100).toFixed(2) : '0';
            document.getElementById('stat-roi').innerText = `${roi>=0?'+':''}${Math.round(roi).toLocaleString()} (${per}%)`;
            document.getElementById('stat-roi').className = roi >= 0 ? 'roi-up' : 'roi-down';
            drawChart(user);
        }

        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var data = assetHistory[user] || [];
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: '市值', data: data.map(h => ({x:h.date, y:h.value})), borderColor: '#3a5fcd', fill: true, backgroundColor: 'rgba(58,95,205,0.1)' },
                        { label: '成本', data: data.map(h => ({x:h.date, y:h.cost})), borderColor: '#999', borderDash: [5,5] }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { type: 'time', time: { unit: 'month' } } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = function(re) {
                const data = JSON.parse(re.target.result);
                // 強制讀取舊備份檔案欄位
                records = data.recs || [];
                marketPrices = data.prices || {};
                assetHistory = data.hist || {};
                users = data.users || ['預設帳戶'];
                saveAll();
                updateUserDropdown();
                render();
                alert('匯入成功！請確認帳戶選單是否切換正確。');
            };
            reader.readAsText(e.target.files[0]);
        }

        function updateUserDropdown() {
            var sel = document.getElementById('user-select');
            sel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
            if(users.length > 0) sel.value = users[0];
        }

        function onUserChange() { render(); }
        
        // 其餘功能（略，維持與之前一致）
        function quickSave() { /* ... */ }
        function renderHistoryList() { /* ... */ }
        function renderSyncPrices() { /* ... */ }

        init();
    </script>
</body>
</html>
