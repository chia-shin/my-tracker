<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>台股自動估值投資記帳系統</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #ffffff; color: #333333; padding: 15px; margin: 0; }
        h1 { font-size: 20px; text-align: center; color: #4472C4; margin-bottom: 15px; }
        .box { background-color: #f8f9fa; border: 1px solid #dddddd; padding: 12px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; width: 100%; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        label { display: block; font-size: 13px; color: #666666; margin: 8px 0 3px 0; font-weight: bold; }
        
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }

        input[type="date"] {
            display: block !important; width: 100% !important; max-width: 100% !important;
            min-width: 100% !important; padding: 10px !important; min-height: 44px; box-sizing: border-box !important;
        }

        button { width: 100%; padding: 12px; background-color: #4472C4; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 12px; box-sizing: border-box; }
        .user-box { border: 2px solid #27ae60; background-color: #f4fbf7; }
        .item { padding: 10px; border-bottom: 1px solid #eeeeee; font-size: 14px; }
        .tag { background-color: #7f8c8d; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge { color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .roi-up { color: #e74c3c; font-weight: bold; }
        .roi-down { color: #2ecc71; font-weight: bold; }
        .future-val { color: #8e44ad; font-weight: bold; font-size: 18px; }
        .del-user-btn { background-color: #e74c3c; margin-top: 8px; padding: 8px; font-size: 13px; width: 100%; }
        
        /* 🔄 自動更新按鈕專屬樣式 */
        .api-btn { background-color: #f39c12; color: white; margin-bottom: 15px; margin-top: 0; }
    </style>
</head>
<body>

    <h1>📈 投資記帳與自動市值系統</h1>

    <!-- 用戶管理區塊 -->
    <div class="box user-box">
        <b style="font-size:15px; color:#27ae60;">👤 使用者切換與管理</b>
        <div class="grid-2" style="margin-top: 5px;">
            <div>
                <label style="margin-top:0;">目前主要使用者：</label>
                <select id="filter-user" style="border: 2px solid #27ae60; font-weight: bold;" onchange="onUserChange()"></select>
            </div>
            <div>
                <label style="margin-top:0;">管理操作：</label>
                <button onclick="addUser()" style="background-color: #27ae60; margin-top: 0; padding: 10px;">➕ 建立帳戶</button>
            </div>
        </div>
        <button onclick="deleteUser()" class="del-user-btn">❌ 刪除當前所選使用者</button>
    </div>

    <!-- 🔄 證交所 API 自動更新功能 -->
    <button onclick="fetchTaiwanStockPrices()" class="api-btn">🔄 自動抓取證交所最新收盤價更新市值</button>

    <div>
        <label>🔍 切換檢視標的：</label>
        <select id="filter-target" onchange="render()"></select>
    </div>

    <!-- 數據看板 -->
    <div class="box">
        <div class="row">
            <div>
                <label>當前資產市值 (自動同步)</label>
                <div id="stat-value" style="font-size: 18px; font-weight: bold; color: #f39c12;">$0</div>
            </div>
            <div>
                <label>累計投入成本</label>
                <div id="stat-net" style="font-size: 18px; font-weight: bold; color: #333333;">$0</div>
            </div>
        </div>
        <div class="row" style="margin-top: 5px; border-top: 1px dashed #ddd; padding-top: 5px;">
            <div>
                <label>歷史未實現損益 / 報酬率</label>
                <div id="stat-roi" style="font-size: 16px; font-weight: bold;">$0 (0.00%)</div>
            </div>
        </div>
    </div>

    <!-- 未來複利預測模型 -->
    <div class="box" style="border: 1px solid #8e44ad; background-color: #faf5ff;">
        <b style="font-size:15px; color:#8e44ad;">🔮 未來資產複利增長預測 (包含每年再投入)</b>
        <div class="grid-2">
            <div>
                <label>預估年化報酬率 (%)</label>
                <input type="number" id="future-rate" value="12" placeholder="例如: 12" inputmode="decimal" oninput="render()">
            </div>
            <div>
                <label>預估持有年數 (年)</label>
                <input type="number" id="future-years" value="5" placeholder="例如: 5" inputmode="numeric" oninput="render()">
            </div>
        </div>
        <div>
            <label>未來每年固定「再投入金額」</label>
            <input type="number" id="future-annual-inject" value="100000" placeholder="例如: 100000" inputmode="numeric" oninput="render()">
        </div>
        <div style="margin-top: 10px; padding-top: 5px; border-top: 1px solid #e8dbf3;">
            <label style="margin-top:0;">🎯 複利滾存 + 持續投入後的未來總值：</label>
            <div id="stat-future" class="future-val">$0</div>
        </div>
    </div>

    <!-- 新增紀錄 -->
    <div class="box">
        <b style="font-size:16px;">✨ 新增投資紀錄</b>
        
        <label>投資標的代號 (請填純數字，例如：2330、0050、00675L)</label>
        <input type="text" id="form-target" placeholder="例如：2330、0050">

        <label>日期</label>
        <input type="date" id="form-date">
        
        <label>交易類型</label>
        <select id="form-type" onchange="toggleFields()">
            <option value="deposit">買入 (投入總額)</option>
            <option value="withdraw">賣出 (贖回總額)</option>
            <option value="value_update">更新最新現價 (或總值)</option>
        </select>

        <div id="trade-group" class="grid-3">
            <div>
                <label id="lbl-p2">買入股數</label>
                <input type="number" id="form-shares" placeholder="股數" inputmode="decimal" oninput="calcPrice()">
            </div>
            <div>
                <label id="lbl-amt">實際總金額</label>
                <input type="number" id="form-amount" placeholder="總金額" inputmode="decimal" oninput="calcPrice()">
            </div>
            <div>
                <label id="lbl-p1">計算出單價</label>
                <input type="number" id="form-price" placeholder="自動計算" inputmode="decimal" readonly style="background-color: #eee; color: #555;">
            </div>
        </div>

        <label>說明備註</label>
        <input type="text" id="form-desc" placeholder="摘要備註">

        <button onclick="addRecord()">確認儲存</button>
    </div>

    <div class="box">
        <b style="font-size:16px;">📋 歷史紀錄明細</b>
        <div id="records-list" style="margin-top: 10px;"></div>
    </div>

    <script>
        var records = JSON.parse(localStorage.getItem('multi_user_records_v4')) || [];
        var users = JSON.parse(localStorage.getItem('multi_users_list_v4')) || ['預設使用者'];

        document.getElementById('form-date').value = new Date().toISOString().split('T');

        // 🔄 透過臺灣證券交易所 OpenAPI 抓取當天最新收盤數據
        async function fetchTaiwanStockPrices() {
            var currentUser = document.getElementById('filter-user').value;
            
            // 1. 找出當前使用者手上有幾檔「正在持有」的標的代號
            var myStocks = [];
            var stockSharesMap = {};
            for (var i = 0; i < records.length; i++) {
                if (records[i].user === currentUser) {
                    var t = records[i].target;
                    if (records[i].transaction_type === 'deposit' || records[i].transaction_type === 'withdraw') {
                        stockSharesMap[t] = (stockSharesMap[t] || 0) + records[i].shares;
                    }
                }
            }
            for (var code in stockSharesMap) {
                if (stockSharesMap[code] > 0) myStocks.push(code);
            }

            if (myStocks.length === 0) return alert('ℹ️ 您名下目前沒有持股，不需同步！');

            alert('⏳ 正在連線臺灣證券交易所 API 讀取最新市價，請稍候...');

            try {
                // 讀取證交所當日個股收盤行情大資料集
                var response = await fetch('https://twse.com.tw');
                if (!response.ok) throw new Error('API連線失敗');
                var stockDataList = await response.json();

                var updateCount = 0;
                var todayStr = new Date().toISOString().split('T')[0];

                // 2. 比對代號，抓取對應收盤價並寫入自動估值紀錄
                for (var j = 0; j < stockDataList.length; j++) {
                    var s = stockDataList[j];
                    var stockCode = s.Code ? s.Code.trim() : "";
                    
                    if (myStocks.indexOf(stockCode) !== -1) {
                        var closingPrice = parseFloat(s.ClosingPrice);
                        if (!isNaN(closingPrice) && closingPrice > 0) {
                            var currentShares = stockSharesMap[stockCode];
                            var currentMarketVal = closingPrice * currentShares;

                            // 自動寫入一筆最新市值估算
                            records.push({
                                user: currentUser,
                                target: stockCode,
                                date: todayStr,
                                amount: 0,
                                transaction_type: 'value_update',
                                description: '🔄 系統自動同步證交所市價',
                                current_value: currentMarketVal,
                                price: closingPrice,
                                shares: currentShares
                            });
                            updateCount++;
                        }
                    }
                }

                if (updateCount > 0) {
                    localStorage.setItem('multi_user_records_v4', JSON.stringify(records));
                    render();
                    alert('✅ 成功同步 ' + updateCount + ' 檔台股標的之最新市值！');
                } else {
                    alert('ℹ️ 證交所尚未釋出當日收盤數據（通常於13:30後更新），或請確認標的代號是否輸入正確（如：2330）。');
                }

            } catch (error) {
                console.error(error);
                alert('❌ 抓取失敗：可能正值證交所伺服器維護時間，或手機未連線網路。');
            }
        }

        function toggleFields() {
            var type = document.getElementById('form-type').value;
            var priceInput = document.getElementById('form-price');
            var sharesInput = document.getElementById('form-shares');
            var amtInput = document.getElementById('form-amount');
            
            priceInput.value = ''; sharesInput.value = ''; amtInput.value = '';
            priceInput.readOnly = (type !== 'value_update');
            priceInput.style.backgroundColor = (type === 'value_update') ? '#fff' : '#eee';
            priceInput.style.color = (type === 'value_update') ? '#333' : '#555';

            if (type === 'value_update') {
                document.getElementById('lbl-p1').innerText = '最新單現價';
                document.getElementById('lbl-p2').innerText = '現有總股數';
                document.getElementById('lbl-amt').innerText = '或改填總市值';
                priceInput.placeholder = "單價"; sharesInput.placeholder = "選填"; amtInput.placeholder = "選填";
            } else if (type === 'withdraw') {
                document.getElementById('lbl-p1').innerText = '算出的單價'; document.getElementById('lbl-p2').innerText = '賣出股數'; document.getElementById('lbl-amt').innerText = '實際總拿回';
                priceInput.placeholder = "自動計算"; sharesInput.placeholder = "股數"; amtInput.placeholder = "總額";
            } else {
                document.getElementById('lbl-p1').innerText = '算出的單價'; document.getElementById('lbl-p2').innerText = '買入股數'; document.getElementById('lbl-amt').innerText = '實際總扣款';
                priceInput.placeholder = "自動計算"; sharesInput.placeholder = "股數"; amtInput.placeholder = "總額";
            }
        }

        function calcPrice() {
            var type = document.getElementById('form-type').value;
            var shares = parseFloat(document.getElementById('form-shares').value) || 0;
            var amount = parseFloat(document.getElementById('form-amount').value) || 0;
            var priceInput = document.getElementById('form-price');
            
            if (type !== 'value_update') {
                if (shares > 0 && amount > 0) priceInput.value = (amount / shares).toFixed(4);
                else priceInput.value = '';
            } else {
                var price = parseFloat(priceInput.value) || 0;
                if (shares > 0 && price > 0 && amount === 0) document.getElementById('form-amount').value = (price * shares).toFixed(2);
            }
        }

        function addUser() {
            var name = prompt('請輸入新使用者名稱（例如：爸爸、媽媽）：');
            if (!name) return;
            name = name.trim();
            if (users.indexOf(name) !== -1) return alert('此使用者名稱已存在');
            users.push(name);
            localStorage.setItem('multi_users_list_v4', JSON.stringify(users));
            updateUserDropdown();
            document.getElementById('filter-user').value = name;
            onUserChange();
        }

        function deleteUser() {
            var currentUser = document.getElementById('filter-user').value;
            if (users.length <= 1) return alert('❌ 系統必須保留至少一位使用者。');
            if (!confirm('⚠️ 確定要刪除使用者「' + currentUser + '」嗎？') || !confirm('🚨 警告：這會刪除其名下所有資料且無法復原！確定要繼續嗎？')) return;
            
            var updatedRecords = [];
            for (var i = 0; i < records.length; i++) {
                if (records[i].user !== currentUser) updatedRecords.push(records[i]);
            }
            records = updatedRecords;
            localStorage.setItem('multi_user_records_v4', JSON.stringify(records));
            
            var userIndex = users.indexOf(currentUser);
            if (userIndex !== -1) users.splice(userIndex, 1);
            localStorage.setItem('multi_users_list_v4', JSON.stringify(users));
            
            updateUserDropdown();
            document.getElementById('filter-user').value = users;
            onUserChange();
        }

        function updateUserDropdown() {
            var userSelect = document.getElementById('filter-user');
            var currentSel = userSelect.value || users;
            userSelect.innerHTML = '';
            for (var i = 0; i < users.length; i++) {
                userSelect.innerHTML += '<option value="' + users[i] + '">' + users[i] + '</option>';
            }
            userSelect.value = (users.indexOf(currentSel) !== -1) ? currentSel : users;
        }

        function onUserChange() { updateTargetDropdowns(); render(); }

        function updateTargetDropdowns() {
            var currentUser = document.getElementById('filter-user').value;
            var targets = [];
            for (var i = 0; i < records.length; i++) {
                if (records[i].user === currentUser && records[i].target && targets.indexOf(records[i].target) === -1) {
                    targets.push(records[i].target);
                }
            }
            var filterSelect = document.getElementById('filter-target');
            var currentFilter = filterSelect.value || 'ALL';
            filterSelect.innerHTML = '<option value="ALL">顯示所有標的</option>';
            for (var j = 0; j < targets.length; j++) {
                filterSelect.innerHTML += '<option value="' + targets[j] + '">' + targets[j] + '</option>';
            }
            filterSelect.value = currentFilter;
        }

        function addRecord() {
            var currentUser = document.getElementById('filter-user').value;
            var target = document.getElementById('form-target').value.trim();
            var date = document.getElementById('form-date').value;
            var type = document.getElementById('form-type').value;
            var shares = parseFloat(document.getElementById('form-shares').value) || 0;
            var amount = parseFloat(document.getElementById('form-amount').value) || 0;
            var price = parseFloat(document.getElementById('form-price').value) || 0;
            var desc = document.getElementById('form-desc').value.trim();

            if (!target) return alert('請輸入投資標的代號');
            if (!date) return alert('請選擇日期');
            
            if (type !== 'value_update') {
                if (shares <= 0 || amount <= 0) return alert('請輸入有效的股數與總金額');
                price = amount / shares;
            } else {
                if (amount <= 0 && price <= 0) return alert('請填寫最新現價或總市值');
            }

            var current_value = 0;
            if (type === 'withdraw') { amount = -Math.abs(amount); shares = -Math.abs(shares); }
            else if (type === 'value_update') { current_value = amount > 0 ? amount : (price * (shares || 1)); amount = 0; }

            records.push({ 
                user: currentUser, target: target, date: date, amount: amount, 
                transaction_type: type, description: desc, current_value: current_value, price: price, shares: shares 
            });
            
            document.getElementById('form-price').value = ''; document.getElementById('form-shares').value = '';
            document.getElementById('form-amount').value = ''; document.getElementById('form-desc').value = '';
            
            localStorage.setItem('multi_user_records_v4', JSON.stringify(records));
            updateTargetDropdowns();
            render();
        }

        function deleteRecord(index) {
            if (confirm('⚠️ 確定要刪除此筆紀錄嗎？')) {
                records.splice(index, 1);
                localStorage.setItem('multi_user_records_v4', JSON.stringify(records));
                updateTargetDropdowns();
                render();
            }
        }

        function render() {
            var currentUser = document.getElementById('filter-user').value;
            var filterTarget = document.getElementById('filter-target').value || 'ALL';
            var list = document.getElementById('records-list');
            list.innerHTML = '';
            
            var totalNetInput = 0; var totalLatestValue = 0; var targetLatestValueMap = {};
            var userRecords = [];
            for (var a = 0; a < records.length; a++) {
                if (records[a].user === currentUser) userRecords.push(records[a]);
            }

            var sortedForCalc = userRecords.slice().sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
            for (var i = 0; i < sortedForCalc.length; i++) {
                var r = sortedForCalc[i];
                if (r.transaction_type === 'value_update') targetLatestValueMap[r.target] = r.current_value;
            }

            for (var j = 0; j < userRecords.length; j++) {
                var rec = userRecords[j];
                if (filterTarget === 'ALL' || rec.target === filterTarget) {
                    if (rec.transaction_type === 'deposit' || rec.transaction_type === 'withdraw') totalNetInput += rec.amount;
                }
            }

            if (filterTarget === 'ALL') {
                for (var key in targetLatestValueMap) totalLatestValue += targetLatestValueMap[key];
            } else {
                totalLatestValue = targetLatestValueMap[filterTarget] || 0;
            }

            var roiAmt = totalLatestValue - totalNetInput;
            var roiPercent = totalNetInput > 0 ? (roiAmt / totalNetInput * 100).toFixed(2) : '0.00';
            
            document.getElementById('stat-net').innerText = '$' + totalNetInput.toLocaleString(undefined, {maximumFractionDigits:2});
            document.getElementById('stat-value').innerText = '$' + totalLatestValue.toLocaleString(undefined, {maximumFractionDigits:2});
            
            var roiDiv = document.getElementById('stat-roi');
            roiDiv.innerText = (roiAmt >= 0 ? '+' : '') + roiAmt.toLocaleString(undefined, {maximumFractionDigits:2}) + ' (' + roiPercent + '%)';
            roiDiv.className = roiAmt >= 0 ? 'roi-up' : 'roi-down';

            var fRate = parseFloat(document.getElementById('future-rate').value) || 0;
            var fYears = parseFloat(document.getElementById('future-years').value) || 0;
            var fInject = parseFloat(document.getElementById('future-annual-inject').value) || 0;
            var r_rate = fRate / 100; var futureValue = totalLatestValue * Math.pow(1 + r_rate, fYears);
            if (r_rate > 0 && fInject > 0) futureValue += fInject * ((Math.pow(1 + r_rate, fYears) - 1) / r_rate) * (1 + r_rate);
            else futureValue += fInject * fYears;
            
            document.getElementById('stat-future').innerText = '$' + Math.round(futureValue).toLocaleString() + ' 元';

            var displayedRecords = [];
            for (var k = 0; k < userRecords.length; k++) {
                if (filterTarget === 'ALL' || userRecords[k].target === filterTarget) {
                    var realIdx = records.indexOf(userRecords[k]);
                    displayedRecords.push(Object.assign({}, userRecords[k], { originalIdx: realIdx }));
                }
            }
            displayedRecords.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

            if (displayedRecords.length === 0) {
                list.innerHTML = '<p style="color:#999999; text-align:center; padding:10px;">暫無紀錄</p>'; return;
            }

            for (var m = 0; m < displayedRecords.length; m++) {
                var rowData = displayedRecords[m]; var item = document.createElement('div'); item.className = 'item';
                var typeStr = '買入', badgeBg = '#e74c3c', displayAmt = '$' + Math.abs(rowData.amount).toLocaleString();
                if (rowData.transaction_type === 'withdraw') { typeStr = '賣出'; badgeBg = '#2ecc71'; }
                if (rowData.transaction_type === 'value_update') { typeStr = '現值'; badgeBg = '#f39c12'; displayAmt = '$' + rowData.current_value.toLocaleString(); }

                var detailStr = '';
                if (rowData.transaction_type !== 'value_update' && rowData.price > 0) {
                    detailStr = '總額: ' + displayAmt + ' | 股數: ' + Math.abs(rowData.shares) + ' | 成本單價: $' + rowData.price.toFixed(2);
                } else if (rowData.transaction_type === 'value_update') {
                    detailStr = rowData.price > 0 ? '收盤現價: $' + rowData.price.toFixed(2) : '手動更新總值';
                }
                if (rowData.description) detailStr += ' | ' + rowData.description;

                item.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center;">' +
                    '<div>' +
                        '<div><span class="tag">' + rowData.target + '</span> ' + rowData.date + ' <span class="badge" style="background-color:' + badgeBg + '">' + typeStr + '</span></div>' +
                        '<div style="font-size:12px; color:#666666; margin-top:3px;">' + detailStr + '</div>' +
                    '</div>' +
                    '<div style="display:flex; align-items:center; gap:8px;">' +
                        '<span style="font-weight:bold;">' + displayAmt + '</span>' +
                        '<button onclick="deleteRecord(' + rowData.originalIdx + ')" style="background:none; color:#e74c3c; width:auto; margin:0; padding:4px 8px; border:1px solid #e74c3c; font-size:12px;">刪除</button>' +
                    '</div>' +
                '</div>';
                list.appendChild(item);
            }
        }

        updateUserDropdown(); updateTargetDropdowns(); render();
    </script>
</body>
</html>
