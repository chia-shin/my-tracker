<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資走勢分析系統 - 終極完整版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root { --primary: #3a5fcd; --success: #2e7d32; --warning: #ed6c02; --danger: #d32f2f; --border: #e0e0e0; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding-bottom: 70px; color: #2c3e50; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #fff; display: flex; border-top: 1px solid #ddd; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #7f8c8d; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .box { background: #fff; border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 15px; }
        .box-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: block; }
        label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px 0; font-weight: 600; }
        input, select { width: 100%; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; -webkit-appearance: none; }
        .grid-2 { display: flex; gap: 10px; margin-top: 10px; }
        .grid-2 > div { flex: 1; }
        .dash-val { font-size: 22px; font-weight: 800; }
        button { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; width: 100%; }
        .btn-main { background: var(--primary); color: #fff; }
        .btn-sub { background: #f1f2f6; border: 1px solid #ccc; color: #333; }
        .btn-danger { background: var(--danger); color: #fff; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .item { padding: 12px 0; border-bottom: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .tag { background: #718093; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .roi-up { color: var(--danger); } .roi-down { color: var(--success); }
    </style>
</head>
<body>

    <!-- 頁面 1：首頁 -->
    <div id="page-home" class="page active">
        <h2 style="text-align:center;">🏠 我的投資首頁</h2>
        <div class="box" style="border-left: 5px solid var(--primary);">
            <select id="user-select" onchange="onUserChange()"></select>
        </div>
        <div class="box">
            <div class="grid-2">
                <div><label>即時總市值</label><div id="stat-value" class="dash-val" style="color:var(--primary)">$0</div></div>
                <div><label>總投入成本</label><div id="stat-net" class="dash-val">$0</div></div>
            </div>
            <div id="stat-roi" style="margin-top:10px; font-weight:bold; border-top:1px dashed #ddd; padding-top:10px;">$0 (0%)</div>
        </div>
        <div class="box">
            <span class="box-title">📊 資產趨勢圖</span>
            <div class="chart-container"><canvas id="assetChart"></canvas></div>
        </div>
        <div class="box">
            <span class="box-title">➕ 快速新增交易</span>
            <label>標的</label><input type="text" id="f-target" placeholder="例如: 00675L" style="text-transform: uppercase;">
            <label>日期</label><input type="date" id="f-date">
            <div class="grid-2">
                <div><label>股數</label><input type="number" id="f-shares" inputmode="decimal" placeholder="0"></div>
                <div><label>總金額</label><input type="number" id="f-amount" inputmode="decimal" placeholder="0"></div>
            </div>
            <button class="btn-main" style="margin-top:15px;" onclick="quickSave()">儲存交易紀錄</button>
        </div>
    </div>

    <!-- 頁面 2：歷史歷史管理 -->
    <div id="page-history" class="page">
        <h2 style="text-align:center;">📜 歷史管理</h2>
        <div class="box" style="background:#fffdf9; border-left:5px solid var(--warning);">
            <span class="box-title" style="color:var(--warning);">🕒 歷史點位資產補錄</span>
            <label>選擇歷史日期</label>
            <input type="date" id="sync-history-date" onchange="renderSyncPrices()">
            <div id="sync-price-list" style="margin-top:10px;"></div>
            <button class="btn-main" style="background:var(--warning); margin-top:10px;" onclick="saveHistoryPoint()">💾 儲存該日歷史快照</button>
        </div>
        <div class="box">
            <span class="box-title">📋 交易明細</span>
            <div id="records-list"></div>
        </div>
    </div>

    <!-- 頁面 3：系統設定 -->
    <div id="page-settings" class="page">
        <h2 style="text-align:center;">⚙️ 系統設定</h2>
        <div class="box">
            <span class="box-title">👤 帳戶管理</span>
            <div class="grid-2" style="margin-bottom: 12px;">
                <input type="text" id="new-user-name" placeholder="輸入帳戶名稱" style="flex: 2;">
                <button class="btn-main" id="btn-user-action" onclick="addUser()" style="flex: 1; height: 45px;">新增帳戶</button>
            </div>
            <input type="hidden" id="edit-user-old-name">
            <button class="btn-sub" id="btn-cancel-edit" style="display:none; margin-bottom:10px;" onclick="cancelEditUser()">❌ 取消修改名稱</button>
            <div id="user-management-list"></div>
        </div>
        <div class="box">
            <span class="box-title">💾 資料管理</span>
            <button onclick="exportData()" class="btn-sub" style="margin-bottom:10px;">📤 匯出備份 (JSON)</button>
            <button onclick="document.getElementById('importFile').click()" class="btn-sub">📥 匯入資料 (JSON)</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
        <div class="box" style="border-top: 1px solid #eee;">
            <button onclick="if(confirm('確定清除所有快取？這將刪除所有本機記帳資料！')) { localStorage.clear(); location.reload(); }" style="color:red; background:none; border:none; cursor:pointer;">⚠️ 清除瀏覽器快取</button>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)">首頁</div>
        <div class="nav-item" onclick="switchPage('history', this)">歷史</div>
        <div class="nav-item" onclick="switchPage('settings', this)">設定</div>
    </div>

    <script>
        // 資料讀取與儲存核心邏輯
        function getStore(key) { return JSON.parse(localStorage.getItem('v11_'+key) || 'null'); }
        
        var records = getStore('recs') || [];
        var marketPrices = getStore('prices') || {}; 
        var assetHistory = getStore('hist') || {};   
        var users = getStore('users') || ['預設帳戶'];
        var chartInstance = null;

        function saveAll() {
            localStorage.setItem('v11_recs', JSON.stringify(records));
            localStorage.setItem('v11_prices', JSON.stringify(marketPrices));
            localStorage.setItem('v11_hist', JSON.stringify(assetHistory));
            localStorage.setItem('v11_users', JSON.stringify(users));
        }

        function init() {
            updateUserDropdown();
            render();
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('sync-history-date').value = new Date().toISOString().split('T')[0];
        }

        function switchPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            if(pageId === 'home') render();
            if(pageId === 'history') { renderHistoryList(); renderSyncPrices(); }
            if(pageId === 'settings') { cancelEditUser(); renderSettingsUsers(); }
        }

        // 首頁資料計算與邏輯渲染
        function render() {
            var user = document.getElementById('user-select').value;
            if(!user) return;
            var prs = marketPrices[user] || {};
            var port = {}; var tCost = 0; var tValue = 0;
            
            records.filter(r => r.user === user).forEach(r => {
                if(!port[r.target]) port[r.target] = { s: 0, c: 0 };
                port[r.target].s += r.shares; 
                port[r.target].c += r.amount;
            });
            for(var c in port) {
                tCost += port[c].c; 
                tValue += port[c].s * (prs[c] || 0);
            }
            document.getElementById('stat-net').innerText = '$' + Math.round(tCost).toLocaleString();
            document.getElementById('stat-value').innerText = '$' + Math.round(tValue).toLocaleString();
            var roi = tValue - tCost;
            var per = tCost > 0 ? (roi/tCost*100).toFixed(2) : '0';
            document.getElementById('stat-roi').innerText = `${roi>=0?'+':''}${Math.round(roi).toLocaleString()} (${per}%)`;
            document.getElementById('stat-roi').className = roi >= 0 ? 'roi-up' : 'roi-down';
            drawChart(user);
        }

        function renderHistoryList() {
            var user = document.getElementById('user-select').value;
            var list = document.getElementById('records-list');
            list.innerHTML = '';
            var filtered = records.filter(r => r.user === user).sort((a,b) => new Date(b.date) - new Date(a.date));
            if(filtered.length === 0) { list.innerHTML = '<p style="color:gray;text-align:center;">尚無交易紀錄</p>'; return; }
            filtered.forEach((r) => {
                list.innerHTML += `<div class="item">
                    <div><span class="tag">${r.target}</span> <small>${r.date}</small></div>
                    <div style="text-align:right;"><b>$${r.amount.toLocaleString()}</b><br><small style="color:gray">${r.shares.toLocaleString()} 股</small></div>
                </div>`;
            });
        }

        function renderSyncPrices() {
            var user = document.getElementById('user-select').value;
            var date = document.getElementById('sync-history-date').value;
            var container = document.getElementById('sync-price-list');
            
            var targets = [...new Set(records.filter(r => r.user === user && r.date <= date).map(r => r.target))];
            if(targets.length === 0) {
                container.innerHTML = '<p style="color:gray;font-size:13px;text-align:center;padding:10px 0;">該日期前無持有任何標的，無需補錄。</p>';
                return;
            }
            
            container.innerHTML = '<label>請輸入該日當天的收盤單價：</label>' + targets.map(t => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="font-size:14px; font-weight:bold;">${t}</span>
                    <input type="number" class="sync-price-input" data-code="${t}" value="${(marketPrices[user]||{})[t] || ''}" style="width:140px;height:38px;" placeholder="單價">
                </div>
            `).join('');
        }

        function quickSave() {
            var user = document.getElementById('user-select').value;
            var target = document.getElementById('f-target').value.toUpperCase().trim();
            var date = document.getElementById('f-date').value;
            var shares = parseFloat(document.getElementById('f-shares').value);
            var amount = parseFloat(document.getElementById('f-amount').value);
            
            if(!target || !date || isNaN(shares) || isNaN(amount)) return alert('請填寫完整交易資訊');
            
            records.push({ user, target, date, shares, amount });
            
            if(!marketPrices[user]) marketPrices[user] = {};
            if(!marketPrices[user][target]) {
                marketPrices[user][target] = amount / shares; 
            }

            saveAll(); 
            render(); 
            alert('交易紀錄已成功儲存！');
            
            document.getElementById('f-target').value = '';
            document.getElementById('f-shares').value = '';
            document.getElementById('f-amount').value = '';
        }

        function saveHistoryPoint() {
            var user = document.getElementById('user-select').value;
            var date = document.getElementById('sync-history-date').value;
            var inputs = document.getElementsByClassName('sync-price-input');
            
            if(inputs.length === 0) return alert('沒有可儲存的標的資料');

            var dayVal = 0; var dayCost = 0;
            var port = {};
            
            records.filter(r => r.user === user && r.date <= date).forEach(r => {
                port[r.target] = (port[r.target] || 0) + r.shares;
                dayCost += r.amount;
            });
            
            for(let input of inputs) {
                var p = parseFloat(input.value) || 0;
                var code = input.dataset.code;
                if(port[code]) dayVal += port[code] * p;
                
                var todayStr = new Date().toISOString().split('T')[0];
                if(date === todayStr) {
                    if(!marketPrices[user]) marketPrices[user] = {};
                    marketPrices[user][code] = p;
                }
            }
            
            if(!assetHistory[user]) assetHistory[user] = [];
            var exist = assetHistory[user].findIndex(h => h.date === date);
            var snap = { date, value: Math.round(dayVal), cost: Math.round(dayCost) };
            
            if(exist > -1) assetHistory[user][exist] = snap; 
            else assetHistory[user].push(snap);
            
            assetHistory[user].sort((a,b) => new Date(a.date) - new Date(b.date));
            
            saveAll(); 
            alert(`${date} 歷史快照更新成功！`); 
            render();
        }

        function drawChart(user) {
            var ctx = document.getElementById('assetChart').getContext('2d');
            var data = assetHistory[user] || [];
            if(chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: '歷史市值', data: data.map(h => ({x:h.date, y:h.value})), borderColor: '#3a5fcd', backgroundColor: 'rgba(58,95,205,0.1)', fill: true, tension: 0.3 },
                        { label: '歷史成本', data: data.map(h => ({x:h.date, y:h.cost})), borderColor: '#999', borderDash: [5,5], tension: 0 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { x: { type: 'time', time: { unit: 'month' } } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // 帳戶管理：渲染設定頁列表
        function renderSettingsUsers() {
            var list = document.getElementById('user-management-list');
            list.innerHTML = users.map(u => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;">
                    <span style="font-weight:600;">${u}</span>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-sub" style="width:60px; padding:6px; font-size:12px; margin:0;" onclick="startEditUser('${u}')">改名</button>
                        <button class="btn-danger" style="width:60px; padding:6px; font-size:12px; margin:0;" onclick="deleteUser('${u}')">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        // 帳戶管理：新增功能
        function addUser() {
            var nameInput = document.getElementById('new-user-name');
            var name = nameInput.value.trim();
            if(!name) return alert('請輸入帳戶名稱');
            if(users.includes(name)) return alert('帳戶名稱已存在');
            users.push(name);
            saveAll();
            updateUserDropdown();
            renderSettingsUsers();
            nameInput.value = '';
            alert(`已成功新增帳戶: ${name}`);
        }

        // 帳戶管理：進入改名狀態
        function startEditUser(oldName) {
            document.getElementById('new-user-name').value = oldName;
            document.getElementById('edit-user-old-name').value = oldName;
            document.getElementById('btn-user-action').innerText = '確認改名';
            document.getElementById('btn-user-action').setAttribute('onclick', 'renameUser()');
            document.getElementById('btn-cancel-edit').style.display = 'block';
            document.getElementById('new-user-name').focus();
        }

        // 帳戶管理：取消改名狀態
        function cancelEditUser() {
            document.getElementById('new-user-name').value = '';
            document.getElementById('edit-user-old-name').value = '';
            document.getElementById('btn-user-action').innerText = '新增帳戶';
            document.getElementById('btn-user-action').setAttribute('onclick', 'addUser()');
            document.getElementById('btn-cancel-edit').style.display = 'none';
        }

        // 帳戶管理：安全改名（連動更新所有記帳歷史）
        function renameUser() {
            var oldName = document.getElementById('edit-user-old-name').value;
            var newName = document.getElementById('new-user-name').value.trim();
            
            if (!newName) return alert('帳戶名稱不能為空');
            if (oldName === newName) { cancelEditUser(); return; }
            if (users.includes(newName)) return alert('此帳戶名稱已存在');
            
            var userIndex = users.indexOf(oldName);
            if (userIndex > -1) users[userIndex] = newName;
            
            records.forEach(r => {
                if (r.user === oldName) r.user = newName;
            });
            
            if (marketPrices[oldName]) {
                marketPrices[newName] = marketPrices[oldName];
                delete marketPrices[oldName];
            }
            
            if (assetHistory[oldName]) {
                assetHistory[newName] = assetHistory[oldName];
                delete assetHistory[oldName];
            }
            
            saveAll();
            updateUserDropdown();
            cancelEditUser();
            renderSettingsUsers();
            render();
            alert(`帳戶已成功從「${oldName}」更名為「${newName}」！所有資料皆已安全轉移。`);
        }

        // 帳戶管理：刪除功能
        function deleteUser(name) {
            if(users.length <= 1) return alert('系統必須保留至少一個帳戶。');
            if(!confirm(`確定要刪除帳戶「${name}」？這將一併刪除該帳戶的所有交易明細與歷史快照，且無法復原！`)) return;
            
            users = users.filter(u => u !== name);
            records = records.filter(r => r.user !== name);
            delete marketPrices[name];
            delete assetHistory[name];
            
            saveAll();
            updateUserDropdown();
            renderSettingsUsers();
            render();
        }

        function updateUserDropdown() {
            var sel = document.getElementById('user-select');
            var currentVal = sel.value;
            sel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
            if(users.includes(currentVal)) sel.value = currentVal;
            else if(users.length > 0) sel.value = users[0];
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({recs:records, prices:marketPrices, hist:assetHistory, users:users})], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `投資系統備份_${new Date().toISOString().split('T')[0]}.json`; a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = function(re) {
                try {
                    const data = JSON.parse(re.target.result);
                    records = data.recs || []; 
                    marketPrices = data.prices || {};
                    assetHistory = data.hist || {}; 
                    users = data.users || ['預設帳戶'];
                    saveAll(); 
                    updateUserDropdown(); 
                    render(); 
                    alert('資料匯入成功！');
                } catch(err) {
                    alert('檔案解析失敗，請確認是否為正確的 JSON 備份檔。');
                }
            };
            reader.readAsText(e.target.files[0]);
        }

        function onUserChange() { render(); }
        
        // 系統初始化啟動
        init();
    </script>
</body>
</html>
